name: Build Desktop (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    # macos-14 is the Apple Silicon runner image. The product only ships
    # for arm64 — Intel Macs are out of scope.
    runs-on: macos-14
    timeout-minutes: 60
    env:
      # Opt the actions/* JavaScript actions into Node.js 24 ahead of the
      # GitHub Actions runtime making it the default in June 2026. This
      # silences the Node 20 deprecation warning emitted on every run.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Toolchain version used by the build itself (electron-builder etc.).
        # Independent of FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 above, which
        # only governs the runtime that JS-based actions execute under.
        node-version: '20'

    - name: Show toolchain versions
      run: |
        sw_vers
        uname -m
        node --version
        npm --version
        # macOS `codesign` has no --version flag; the build number is what
        # `-h` (help) prints to stderr. Use `which` for a stable identity
        # check, then dump help so the version is still in the log.
        which codesign
        codesign -h 2>&1 | head -n 1 || true
        xcrun --show-sdk-version

    - name: Run macOS build script
      env:
        # Apple Developer signing + notarization. All five secrets must be
        # set for build-mac.sh to enable the proper-signing path; otherwise
        # the build falls back to ad-hoc signing (works, but Gatekeeper
        # blocks first launch unless the user right-clicks → Open).
        # Set these in repo Settings → Secrets and variables → Actions.
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: bash build/build-mac.sh

    # If anything in afterPack or the post-build audit failed, dump the
    # bundle's signature state so the CI log makes the cause obvious
    # without having to download the artifact.
    - name: Diagnose on failure
      if: failure()
      run: |
        set +e
        echo "=== electron/dist/ contents ==="
        ls -la electron/dist/ || true
        APP="$(find electron/dist -maxdepth 3 -name '*.app' -type d | head -1)"
        if [ -n "$APP" ]; then
          echo "=== codesign --verify --verbose=4 $APP ==="
          codesign --verify --verbose=4 --strict "$APP"
          echo "=== codesign --display $APP ==="
          codesign --display --verbose=4 "$APP" 2>&1 | head -40
          echo "=== first 20 nested Mach-Os ==="
          find "$APP" -type f | head -20 | while read -r f; do
            magic="$(xxd -l 4 -p "$f" 2>/dev/null)"
            case "$magic" in
              feedface|feedfacf|cefaedfe|cffaedfe|cafebabe|bebafeca)
                printf '  %s\n' "${f#"$APP/"}"
                codesign --verify --strict "$f" 2>&1 | sed 's/^/    /'
                ;;
            esac
          done
        fi

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: auto-a11y-macos-arm64-dmg
        path: electron/dist/*.dmg
        if-no-files-found: error
        retention-days: 30
