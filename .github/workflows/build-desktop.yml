name: Build Desktop (macOS)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run macOS build script
      run: bash build/build-mac.sh

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: auto-a11y-macos-dmg
        path: electron/dist/*.dmg
        if-no-files-found: error
        retention-days: 30
