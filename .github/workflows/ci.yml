name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt the actions/* JavaScript actions into Node.js 24 ahead of the
  # GitHub Actions runtime making it the default in June 2026. This
  # silences the Node 20 deprecation warning emitted on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # Phase 0: each step is marked continue-on-error so the three tools all
    # run and their failures surface as annotations, while the job itself
    # passes green (so PR authors do not see a spurious red X on a check
    # that is not yet intended to be blocking). In Phase 4 the step-level
    # continue-on-error lines are removed so failures fail the job, AND
    # branch protection is configured to require the job.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Pin the pyright Node binary to the wrapper's version so CI and local
      # resolve identical tools.
      PYRIGHT_PYTHON_FORCE_VERSION: "1.1.408"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Cache pyright Node binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyright-python
          key: pyright-${{ runner.os }}-${{ env.PYRIGHT_PYTHON_FORCE_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy
        run: python -m mypy --python-version ${{ matrix.python-version }}

      - name: Run pyright
        run: python -m pyright --pythonversion ${{ matrix.python-version }}
        continue-on-error: true

      - name: Run ty
        run: python -m ty check
        continue-on-error: true

  openapi_check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify docs/api/openapi.yaml is fresh
        run: python scripts/generate_openapi.py --check

      - name: Validate openapi.yaml with openapi-spec-validator
        run: |
          python -c "from openapi_spec_validator import validate_spec; import yaml; validate_spec(yaml.safe_load(open('docs/api/openapi.yaml')))"

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.12.1
      with:
        mongodb-version: '8.0'

    - name: Install system dependencies
      run: |
        # Update deps
        sudo apt-get update
        # WeasyPrint dependencies (GTK, Pango, etc.) + Ghostscript (PDF audit)
        sudo apt-get install -y \
          libpango-1.0-0 \
          libpangoft2-1.0-0 \
          libgdk-pixbuf2.0-0 \
          libffi-dev \
          libcairo2 \
          libgirepository1.0-dev \
          gir1.2-pango-1.0 \
          ghostscript

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate translations
      run: |
        python tests/validate_translations.py

    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Set up environment variables
      run: |
        cat > .env << EOF
        # CI Configuration
        SECRET_KEY=ci-test-secret-key
        DEBUG=True
        HOST=127.0.0.1
        PORT=5001

        # MongoDB
        MONGODB_URI=mongodb://localhost:27017/
        DATABASE_NAME=auto_a11y_ci_test

        # Disable AI Analysis for CI
        RUN_AI_ANALYSIS=False
        CLAUDE_API_KEY=

        # Browser Configuration
        BROWSER_HEADLESS=True
        BROWSER_TIMEOUT=30000

        # Testing Configuration
        PARALLEL_TESTS=2
        TEST_TIMEOUT=60000

        # CI serves over HTTP, not HTTPS
        SESSION_COOKIE_SECURE=False

        # CI admin credentials (for endpoint health check)
        CI_USERNAME=ci@test.local
        CI_PASSWORD=CiTestPassword123
        EOF

    - name: Initialize directories
      run: |
        mkdir -p logs temp screenshots reports data static/screenshots

    - name: Test database connection
      run: |
        python run.py --test-db

    - name: Run database setup
      run: |
        python run.py --setup --skip-browser

    - name: Create CI admin user
      run: |
        python -c "
        import os
        from dotenv import load_dotenv
        load_dotenv()
        from auto_a11y.core.database import Database
        from auto_a11y.models.app_user import AppUser, UserRole
        from config import config

        email = os.environ['CI_USERNAME']
        password = os.environ['CI_PASSWORD']
        print(f'Creating admin: {email}')
        print(f'Database: {config.DATABASE_NAME}')

        db = Database(config.MONGODB_URI, config.DATABASE_NAME)
        user = AppUser.create(email=email, password=password, role=UserRole.ADMIN)
        user.is_superadmin = True
        db.create_app_user(user)

        # Verify the user can be found and password works
        found = db.get_app_user_by_email(email)
        assert found is not None, f'User {email} not found after creation!'
        assert found.check_password(password), 'Password verification failed!'
        print(f'Verified: user {found.email} exists and password is correct')
        "

    - name: Run pytest
      run: |
        python -m pytest tests/ -v

    - name: Run check scripts
      run: |
        echo "=== Running standalone check scripts ==="
        python tests/check_catalog.py
        python tests/check_translation_wrapper.py
        python tests/check_metadata_flow.py
        python tests/check_fixture_tests.py
        python tests/check_test_results.py
        python tests/check_documents_touchpoint.py
        python tests/check_ai_headings.py
        python tests/check_all_ai_issues.py
        echo "=== All check scripts passed ==="

    - name: Test Flask app and endpoints
      run: |
        # Start Flask app in background
        python run.py --no-reloader &
        APP_PID=$!

        # Wait for app to start (max 30 seconds)
        echo "Waiting for Flask app to start..."
        for i in {1..30}; do
          if curl -s http://127.0.0.1:5001/ > /dev/null 2>&1; then
            echo "✓ Flask app is running!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "✗ Flask app failed to start within 30 seconds"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
          sleep 1
        done

        # Test homepage returns 200 (or 302)
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5001/)
        echo "Homepage HTTP status: $HTTP_CODE"

        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "✓ Homepage is accessible!"
        else
          if [ "$HTTP_CODE" -eq 302 ]; then
            echo "✓ Homepage is accessible w/ redirect!"
          else
            echo "✗ Homepage returned status $HTTP_CODE"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
        fi

        # Run endpoint health check (skips if CI_USERNAME not set)
        python tests/check_endpoints.py

        # Clean up
        kill $APP_PID 2>/dev/null || true

        echo "✓ CI tests passed!"
