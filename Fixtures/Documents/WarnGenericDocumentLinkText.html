<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generic Document Link Text Warning Test - WarnGenericDocumentLinkText</title>
    <script type="application/json" id="test-metadata">
{
    "id": "WarnGenericDocumentLinkText",
    "issueId": "WarnGenericDocumentLinkText",
    "expectedViolationCount": 0,
    "expectedWarningCount": 3,
    "expectedPassCount": 0,
    "enforceElementExpectations": true,
    "description": "Links pointing to downloadable documents whose visible text is generic (such as Download PDF, Download Excel, or Document) and does not describe the document content. Each demonstrated case is validated individually.",
    "wcag": "2.4.4"
}
    </script>
</head>
<body>
    <h1>Generic Document Link Text</h1>
    
    <!-- Generic PDF link text -->
    <a href="report.pdf">PDF</a>
    
    <!-- Generic document type links -->
    <a href="data.xlsx">Excel</a>
    <a href="document.docx">Word</a>
    <a href="presentation.pptx">PowerPoint</a>
    
    <!-- Links with only file extension as text -->
    <a href="manual.pdf">.pdf</a>
    <a href="spreadsheet.csv">.csv</a>
    
    <!-- Generic download text -->
    <a href="report.pdf" data-expected-warning="true" data-warning-id="WarnGenericDocumentLinkText" data-warning-reason="Document link text is the generic phrase Download PDF">Download PDF</a>
    <a href="data.xlsx" data-expected-warning="true" data-warning-id="WarnGenericDocumentLinkText" data-warning-reason="Document link text is the generic phrase Download Excel">Download Excel</a>
    
    <!-- Document type only -->
    <a href="annual-report.pdf" data-expected-warning="true" data-warning-id="WarnGenericDocumentLinkText" data-warning-reason="Document link text is the generic word Document">Document</a>
    <a href="budget.xlsx">Spreadsheet</a>
    
    <p>Links should describe content, not just file type.</p>
</body>
</html>
