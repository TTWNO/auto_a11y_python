<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missing Accessible Names - Title Attribute Anti-pattern</title>
    <script type="application/json" id="test-metadata">
{
    "enforceElementExpectations": true,
    "id": "ErrTitleAsOnlyLabel_003_violations_various_inputs",
    "issueId": "ErrTitleAsOnlyLabel",
    "expectedViolationCount": 4,
    "expectedPassCount": 0,
    "description": "Various form input types using title attribute as only label (button case emits ErrTitleAttrFound - its content is its accessible name)",
    "wcag": "4.1.2",
    "impact": "High"
}
    </script>
</head>
<body>
    <h1>Contact Form - Title Attribute Issues</h1>

    <form>
        <div>
            <input type="text" name="name" title="Your full name"
                   data-expected-violation="true"
                   data-violation-id="ErrTitleAsOnlyLabel"
                   data-violation-reason="Title attribute is not reliably announced by screen readers and should not be sole source of accessible name">
        </div>

        <div>
            <input type="email" name="email" title="Email address for contact"
                   data-expected-violation="true"
                   data-violation-id="ErrTitleAsOnlyLabel"
                   data-violation-reason="Title attribute is not a reliable accessible name">
        </div>

        <div>
            <select name="subject" title="Subject of inquiry"
                    data-expected-violation="true"
                    data-violation-id="ErrTitleAsOnlyLabel"
                    data-violation-reason="Title attribute alone does not provide accessible name">
                <option value="">Select...</option>
                <option value="sales">Sales</option>
                <option value="support">Support</option>
            </select>
        </div>

        <div>
            <textarea name="message" title="Your message"
                      data-expected-violation="true"
                      data-violation-id="ErrTitleAsOnlyLabel"
                      data-violation-reason="Title attribute is not sufficient for accessible name"></textarea>
        </div>

        <!-- A button's accessible name comes from its content (the emoji), so
             the title is not its ONLY label; the engine reports the generic
             title-attribute violation ErrTitleAttrFound here instead -->
        <div>
            <button type="button" title="Send message"
                    data-expected-violation="true"
                    data-violation-id="ErrTitleAttrFound"
                    data-violation-reason="Button conveys critical information only through its title attribute tooltip, which is inaccessible to screen magnifier, touch, and keyboard users">📧</button>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
