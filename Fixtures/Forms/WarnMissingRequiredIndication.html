<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarnMissingRequiredIndication - Basic Example</title>
    <script type="application/json" id="test-metadata">
{
    "id": "WarnMissingRequiredIndication",
    "issueId": "WarnMissingRequiredIndication",
    "expectedViolationCount": 0,
    "expectedWarningCount": 1,
    "expectedPassCount": 1,
    "enforceElementExpectations": true,
    "description": "Basic example: required field without visual indicator (warning) vs with asterisk indicator (pass)",
    "wcag": "3.3.2",
    "impact": "Medium"
}
    </script>
</head>
<body>
    <h1>Contact Form</h1>

    <form>
        <!-- Warning: Has required attribute but no visual indicator in label -->
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   data-expected-warning="true"
                   data-warning-id="WarnMissingRequiredIndication"
                   data-warning-reason="Field has required attribute but label has no asterisk or 'required' text">
        </div>

        <!-- Correct: Has required attribute AND asterisk in label -->
        <div>
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required
                   data-expected-pass="true"
                   data-pass-reason="Field has required attribute and label contains asterisk">
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
