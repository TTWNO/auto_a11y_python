<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty Heading Test - ErrEmptyHeading</title>
    <script type="application/json" id="test-metadata">
{
    "id": "ErrEmptyHeading",
    "issueId": "ErrEmptyHeading",
    "expectedViolationCount": 3,
    "expectedWarningCount": 0,
    "expectedPassCount": 1,
    "enforceElementExpectations": true,
    "description": "Empty headings that break document structure: an empty h2, a whitespace-only h3, and a comment-only h4. The engine flags each empty heading. A valid h1 with text is the correct comparison case.",
    "wcag": "1.3.1,2.4.6"
}
    </script>
</head>
<body>
    <h1 data-expected-pass="true" data-pass-reason="h1 has visible text content, not empty">Valid Main Heading</h1>
    
    <!-- Empty heading with no content -->
    <h2 data-expected-violation="true" data-violation-id="ErrEmptyHeading" data-violation-reason="h2 has no content at all"></h2>
    
    <!-- Heading with only whitespace -->
    <h3 data-expected-violation="true" data-violation-id="ErrEmptyHeading" data-violation-reason="h3 contains only whitespace">   </h3>
    
    <!-- Heading with only HTML comments -->
    <h4 data-expected-violation="true" data-violation-id="ErrEmptyHeading" data-violation-reason="h4 contains only an HTML comment, no text"><!-- This is just a comment --></h4>
    
    <!-- Heading with only non-visible content -->
    <h2><span style="display:none">Hidden text</span></h2>
    
    <p>This page tests detection of empty headings that break document structure.</p>
</body>
</html>
