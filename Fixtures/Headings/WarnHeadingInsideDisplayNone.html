<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading Inside Display None Test - WarnHeadingInsideDisplayNone</title>
    <style>
        .hidden-section {
            display: none;
        }
        
        .invisible {
            visibility: hidden;
        }
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    <script type="application/json" id="test-metadata">
{
    "id": "WarnHeadingInsideDisplayNone",
    "issueId": "WarnHeadingInsideDisplayNone",
    "expectedViolationCount": 0,
    "expectedWarningCount": 1,
    "expectedInfoCount": 0,
    "expectedPassCount": 1,
    "enforceElementExpectations": true,
    "description": "A heading rendered inside a hidden subtree is flagged with WarnHeadingInsideDisplayNone. The screen-reader-only heading is positioned off-screen but remains available to assistive technology, so it is the correct comparison case that must not trigger the warning.",
    "wcag": "1.3.1"
}
    </script>
</head>
<body>
    <h1>Page with Hidden Headings</h1>
    
    <!-- Heading inside display:none container -->
    <div class="hidden-section">
        <h2>This Heading is Hidden</h2>
        <p>This entire section is hidden with display:none.</p>
    </div>
    
    <!-- Heading with visibility:hidden -->
    <h2 class="invisible" data-expected-warning="true" data-warning-id="WarnHeadingInsideDisplayNone" data-warning-reason="heading is inside a hidden subtree and removed from the accessibility tree">Invisible Heading</h2>
    
    <!-- Heading hidden but available to screen readers -->
    <h2 class="sr-only" data-expected-pass="true" data-pass-reason="screen-reader-only heading is visually hidden but remains in the accessibility tree so it does not trigger WarnHeadingInsideDisplayNone">Screen Reader Only Heading</h2>
    
    <!-- Heading in element that will be shown later -->
    <div style="display: none;" id="modal">
        <h2>Modal Heading</h2>
        <p>This heading is in a modal that's currently hidden.</p>
    </div>
    
    <p>Hidden headings can disrupt document structure.</p>
</body>
</html>
