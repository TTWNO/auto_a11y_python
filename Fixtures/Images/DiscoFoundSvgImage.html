<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found SVG Image Discovery Test - DiscoFoundSvgImage</title>
    <script type="application/json" id="test-metadata">
{
    "id": "DiscoFoundSvgImage",
    "issueId": "DiscoFoundSvgImage",
    "expectedViolationCount": 0,
    "expectedWarningCount": 0,
    "expectedPassCount": 0,
    "enforceElementExpectations": true,
    "description": "An img element whose source points at an .svg file is discovered for manual review of the SVG accessibility.",
    "wcag": "1.1.1"
}
    </script>
</head>
<body>
    <h1>SVG Image Discovery</h1>
    
    <!-- SVG used as image source -->
    <img src="icon.svg" alt="Icon" data-expected-discovery="true" data-discovery-id="DiscoFoundSvgImage" data-discovery-reason="img element with .svg source discovered for manual review">
    
    <!-- SVG in object element -->
    <object data="diagram.svg" type="image/svg+xml">
        <p>Your browser doesn't support SVG</p>
    </object>
    
    <!-- SVG in embed element -->
    <embed src="graphic.svg" type="image/svg+xml">
    
    <!-- SVG as background image -->
    <div style="background-image: url('pattern.svg'); width: 200px; height: 200px;">
        Content with SVG background
    </div>
    
    <!-- SVG in iframe -->
    <iframe src="chart.svg" width="400" height="300" title="Chart"></iframe>
    
    <p>This page uses SVG images in various ways for discovery tracking.</p>
</body>
</html>
