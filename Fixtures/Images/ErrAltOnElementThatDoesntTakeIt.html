<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alt on Wrong Element Test - ErrAltOnElementThatDoesntTakeIt</title>
    <script type="application/json" id="test-metadata">
{
    "id": "ErrAltOnElementThatDoesntTakeIt",
    "issueId": "ErrAltOnElementThatDoesntTakeIt",
    "expectedViolationCount": 6,
    "expectedWarningCount": 0,
    "expectedPassCount": 0,
    "enforceElementExpectations": true,
    "description": "Each element that does not support the alt attribute (div, span, p, a, button, heading) but carries one is flagged individually. The alt attribute is only valid on img, area, and image-type input elements.",
    "wcag": "1.1.1"
}
    </script>
</head>
<body>
    <h1>Alt Attribute on Non-Image Elements</h1>
    
    <!-- Alt on div -->
    <div alt="This is not an image" data-expected-violation="true" data-violation-id="ErrAltOnElementThatDoesntTakeIt" data-violation-reason="alt attribute on a div element">
        This div has an alt attribute but shouldn't.
    </div>
    
    <!-- Alt on span -->
    <span alt="Decorative element" data-expected-violation="true" data-violation-id="ErrAltOnElementThatDoesntTakeIt" data-violation-reason="alt attribute on a span element">★</span>
    
    <!-- Alt on paragraph -->
    <p alt="Paragraph description" data-expected-violation="true" data-violation-id="ErrAltOnElementThatDoesntTakeIt" data-violation-reason="alt attribute on a paragraph element">
        This paragraph has an alt attribute incorrectly.
    </p>
    
    <!-- Alt on link (should use title or aria-label instead) -->
    <a href="page.html" alt="Link description" data-expected-violation="true" data-violation-id="ErrAltOnElementThatDoesntTakeIt" data-violation-reason="alt attribute on an anchor element">
        Link with alt attribute
    </a>
    
    <!-- Alt on button -->
    <button alt="Button description" data-expected-violation="true" data-violation-id="ErrAltOnElementThatDoesntTakeIt" data-violation-reason="alt attribute on a button element">
        Click me
    </button>
    
    <!-- Alt on heading -->
    <h2 alt="Section heading" data-expected-violation="true" data-violation-id="ErrAltOnElementThatDoesntTakeIt" data-violation-reason="alt attribute on a heading element">Section Title</h2>
    
    <p>Alt attributes should only be used on img, area, and input type="image" elements.</p>
</body>
</html>
