<!DOCTYPE html>
<html lang="english"
      data-expected-violation="true"
      data-violation-id="ErrInvalidLanguageCode"
      data-violation-reason="lang='english' is not a valid ISO 639 code, should be 'en'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErrInvalidLanguageCode - Violations</title>
    <script type="application/json" id="test-metadata">
{
    "enforceElementExpectations": true,
    "id": "ErrInvalidLanguageCode_001_violations_basic",
    "issueId": "ErrInvalidLanguageCode",
    "expectedViolationCount": 1,
    "expectedPassCount": 0,
    "description": "Invalid language codes that don't conform to ISO 639 standards; element-level cases emit ErrElementPrimaryLangNotRecognized ('eng') or ErrInvalidLangChange ('spanish', 'deutsch') instead",

    "impact": "High"
}

<body>
    <h1>Welcome to Our Website</h1>

       data-expected-violation="true"
       data-violation-id="ErrInvalidLangChange"
