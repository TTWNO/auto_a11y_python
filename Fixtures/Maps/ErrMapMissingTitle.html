<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Missing Title Test - ErrMapMissingTitle</title>
    <script type="application/json" id="test-metadata">
{
    "id": "ErrMapMissingTitle",
    "issueId": "ErrMapMissingTitle",
    "expectedViolationCount": 5,
    "expectedWarningCount": 0,
    "expectedPassCount": 0,
    "enforceElementExpectations": true,
    "description": "Map iframes (Google Maps, OpenStreetMap, Mapbox, store-locator, etc.) with a missing or empty title attribute. Each is validated individually.",
    "wcag": "2.4.1,4.1.2"
}
    </script>
</head>
<body>
    <h1>Maps Without Accessible Titles</h1>
    
    <!-- Google Maps iframe without title -->
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3024" 
            width="600" height="450" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" data-expected-violation="true" data-violation-id="ErrMapMissingTitle" data-violation-reason="map iframe missing title">
    </iframe>
    
    <!-- OpenStreetMap iframe without title -->
    <iframe width="425" height="350" 
            frameborder="0" scrolling="no" 
            marginheight="0" marginwidth="0" 
            src="https://www.openstreetmap.org/export/embed.html" data-expected-violation="true" data-violation-id="ErrMapMissingTitle" data-violation-reason="map iframe missing title">
    </iframe>
    
    <!-- Mapbox iframe with empty title -->
    <iframe width="100%" height="400" 
            title=""
            src="https://api.mapbox.com/styles/embed" data-expected-violation="true" data-violation-id="ErrMapMissingTitle" data-violation-reason="map iframe empty title">
    </iframe>
    
    <!-- Custom map application without title -->
    <iframe src="/maps/store-locator.html" 
            width="800" height="600" data-expected-violation="true" data-violation-id="ErrMapMissingTitle" data-violation-reason="map iframe missing title">
    </iframe>
    
    <!-- Bing Maps embed without title -->
    <iframe width="500" height="400" 
            frameborder="0" 
            src="https://www.bing.com/maps/embed" data-expected-violation="true" data-violation-id="ErrMapMissingTitle" data-violation-reason="map iframe missing title">
    </iframe>
    
    <p>Map iframes need descriptive titles for accessibility.</p>
</body>
</html>
