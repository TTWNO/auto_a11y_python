<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Order Test - AI_InfoContentOrder</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        .layout { display: flex; gap: 24px; }
        /* The aside is the FIRST child in the DOM but is displayed on the right
           via flex order, while the article (SECOND in DOM) is shown on the left.
           This is not clearly wrong — it is a common, often-intentional pattern —
           so it is worth surfacing for a human to confirm the reading order makes
           sense, rather than flagging it as a definite error. -->
        .aside { order: 2; width: 240px; }
        .article { order: 1; flex: 1; }
    </style>
</head>
<body>
    <h1>Weekly Newsletter</h1>

    <div class="layout"
         data-expected-info="true"
         data-info-id="AI_InfoContentOrder"
         data-info-reason="Visual column order differs from DOM order via flex 'order'; reading order is plausibly intentional but worth manual confirmation">
        <aside class="aside">
            <h2>Quick Links</h2>
            <ul>
                <li><a href="#archive">Archive</a></li>
                <li><a href="#subscribe">Subscribe</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </aside>

        <article class="article">
            <h2>This Week's Highlights</h2>
            <p>Our team shipped several improvements this week, including faster
               page loads and a refreshed dashboard.</p>
            <p>Read on for the full details and what is coming next.</p>
        </article>
    </div>
</body>
</html>
