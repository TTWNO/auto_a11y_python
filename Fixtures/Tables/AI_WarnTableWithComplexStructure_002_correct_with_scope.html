<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_WarnTableWithComplexStructure - Correct Usage</title>
    <script type="application/json" id="test-metadata">
{
    "id": "AI_WarnTableWithComplexStructure_002_correct_with_scope",
    "issueId": "AI_WarnTableWithComplexStructure",
    "expectedViolationCount": 0,
    "expectedPassCount": 2,
    "description": "Simple single-level data tables (one header row, scope=col, no merged cells), which are not complex and need no manual-review warning",
    "wcag": "1.3.1",
    "impact": "Medium"
}
    </script>
    <style>
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Sales Reports</h1>

    <main>
        <section data-expected-pass="true"
                 data-pass-reason="Simple data table: a single header row with scope='col' and plain data rows. No multi-level or merged headers, so it is not a complex structure and needs no manual-review warning.">
            <h2>Quarterly Sales</h2>

            <table>
                <caption>Quarterly sales totals</caption>
                <thead>
                    <tr>
                        <th scope="col">Quarter</th>
                        <th scope="col">Revenue</th>
                        <th scope="col">Units Sold</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Q1</td><td>$10,000</td><td>120</td></tr>
                    <tr><td>Q2</td><td>$12,000</td><td>140</td></tr>
                    <tr><td>Q3</td><td>$11,000</td><td>130</td></tr>
                    <tr><td>Q4</td><td>$13,000</td><td>150</td></tr>
                </tbody>
            </table>
        </section>

        <section data-expected-pass="true"
                 data-pass-reason="Simple data table: one header row with scope='col', no rowspan/colspan and no second header level. Screen readers follow it without any complex association, so no complexity warning is warranted.">
            <h2>Team Roster</h2>

            <table>
                <caption>Team members and roles</caption>
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Role</th>
                        <th scope="col">Location</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Alex Kim</td><td>Engineer</td><td>Toronto</td></tr>
                    <tr><td>Jordan Lee</td><td>Designer</td><td>Halifax</td></tr>
                    <tr><td>Sam Patel</td><td>Manager</td><td>Calgary</td></tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
