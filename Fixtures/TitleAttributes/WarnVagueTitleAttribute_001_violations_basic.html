<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation - Vague Title Attributes</title>
    <script type="application/json" id="test-metadata">
{
    "enforceElementExpectations": true,
    "id": "WarnVagueTitleAttribute_001_violations_basic",
    "issueId": "WarnVagueTitleAttribute",
    "expectedViolationCount": 3,
    "expectedPassCount": 0,
    "description": "Title attributes contain vague or redundant information (redundant-title case emits ErrImproperTitleAttribute)",
    "wcag": "3.3.2",
    "impact": "Low"
}
    </script>
</head>
<body>
    <h1>Dashboard</h1>

    <nav>
        <div>
            <a href="/profile" title="Click here"
               data-expected-violation="true"
               data-violation-id="WarnVagueTitleAttribute"
               data-violation-reason="Title attribute 'Click here' is vague and doesn't provide useful information">My Profile</a>
        </div>

        <!-- Title duplicating the visible text emits the more specific
             ErrImproperTitleAttribute (redundant-title branch) -->
        <div>
            <a href="/settings" title="Settings"
               data-expected-violation="true"
               data-violation-id="ErrImproperTitleAttribute"
               data-violation-reason="Title attribute repeats visible link text exactly, providing no additional value">Settings</a>
        </div>

        <div>
            <a href="/help" title="Link"
               data-expected-violation="true"
               data-violation-id="WarnVagueTitleAttribute"
               data-violation-reason="Generic 'Link' title provides no meaningful supplementary information">Help Center</a>
        </div>
    </nav>

    <main>
        <h2>Recent Activity</h2>

        <div>
            <button type="button" title="Button"
                    data-expected-violation="true"
                    data-violation-id="WarnVagueTitleAttribute"
                    data-violation-reason="Title 'Button' is generic and redundant, adds no useful context">Refresh Data</button>
        </div>

        <p>Your last login was yesterday at 3:45 PM.</p>
    </main>
</body>
</html>
