{% extends "base.html" %}

{% block title %}{{ ftl('auth-contact-us') }} - {{ ftl('common-auto-a11y') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h1 class="mb-0"><i class="bi bi-envelope" aria-hidden="true"></i> {{ ftl('auth-contact-us') }}</h1>
            </div>
            <div class="card-body">
                <p>{{ ftl('auth-to-request-access-to-auto-a11y-please-contact') }}</p>
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('auth.login') }}">{{ ftl('auth-back-to-login') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
