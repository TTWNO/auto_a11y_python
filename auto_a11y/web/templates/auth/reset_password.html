{% extends "base.html" %}

{% block title %}{{ ftl('auth-reset-password') }} - {{ ftl('common-auto-a11y') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h1 class="mb-0"><i class="bi bi-key" aria-hidden="true"></i> {{ ftl('auth-reset-password') }}</h1>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <fieldset>
                        <legend class="visually-hidden">{{ ftl('auth-new-password') }}</legend>
                        <div class="mb-3">
                            <label for="password" class="form-label">{{ ftl('auth-new-password') }} <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password" required minlength="8" autocomplete="new-password" aria-describedby="password_help">
                            <div class="form-text" id="password_help">{{ ftl('auth-minimum-8-characters') }}</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">{{ ftl('auth-confirm-password') }} <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check-lg" aria-hidden="true"></i> {{ ftl('auth-set-new-password') }}
                        </button>
                    </fieldset>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('auth.login') }}">{{ ftl('auth-back-to-login') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
