<button type="button" id="theme-toggle" class="theme-toggle"
    aria-label="{{ ftl('common-color-theme-automatic-switch-to-light') }}"
    data-label-auto="{{ ftl('common-color-theme-automatic-switch-to-light') }}"
    data-label-light="{{ ftl('common-color-theme-light-switch-to-dark') }}"
    data-label-dark="{{ ftl('common-color-theme-dark-switch-to-automatic') }}"
    data-announce-auto="{{ ftl('common-color-theme-changed-to-automatic') }}"
    data-announce-light="{{ ftl('common-color-theme-changed-to-light') }}"
    data-announce-dark="{{ ftl('common-color-theme-changed-to-dark') }}">
    <span data-theme-icon="auto" aria-hidden="true">&#x25D0;</span>
    <span data-theme-icon="light" aria-hidden="true" hidden>&#x2600;</span>
    <span data-theme-icon="dark" aria-hidden="true" hidden>&#x263D;</span>
</button>
<div id="theme-announce" aria-live="polite" aria-atomic="true"></div>
