{# Per-check status card. Expects ``failure`` in scope (a CheckResult). #}
<article class="card" aria-labelledby="check-{{ failure.name }}-heading">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <h3 id="check-{{ failure.name }}-heading" class="h5 mb-0">
                <i class="bi bi-x-circle-fill text-severity-high" aria-hidden="true"></i>
                {{ failure.description }}
            </h3>
            <span class="badge badge-high">{{ ftl('recovery-check-failed') }}</span>
        </div>
        {% if failure.remediation %}
        <p class="mb-0 small">{{ failure.remediation }}</p>
        {% endif %}
    </div>
</article>
