# Dev-only overrides. Docker Compose auto-merges this on top of
# docker-compose.yml, so `docker compose up` (or `podman-compose up`) gets
# live-reload for free.
#
# To run without the dev overrides (e.g. to mimic prod), use:
#   docker compose -f docker-compose.yml up

services:
  app:
    build:
      context: .
      target: dev
      # See docker-compose.yml for the production stage. The dev
      # stage doesn't COPY pdfMax in (we bind-mount it instead, see
      # ``volumes`` below), but Docker still requires the named
      # context to exist whenever the Dockerfile references it.
      additional_contexts:
        pdfmax_checker: ../pdfMax/python/checker
    # Run Flask with the reloader. --debug flips config.DEBUG, which run.py
    # forwards into app.run() as use_reloader=True.
    command: python run.py --host 0.0.0.0 --debug
    volumes:
      # Mount the source tree so host edits land in the container.
      - .:/app
      # Override the named volumes from docker-compose.yml so these
      # directories are live on the host too (no shadowing).
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
      - ./data:/app/data
      # Shadow the bind mount for paths that must stay container-owned:
      # the host's .venv (if any) targets the host's OS/Python, and
      # __pycache__ would pollute the host tree.
      - /app/.venv
      - /app/__pycache__
      # pdfMax verbatim audit tool, bind-mounted read-only so live
      # edits to the host checkout (and ``git pull``) flow into the
      # container without a rebuild. Path resolves relative to the
      # compose file: assumes pdfMax is checked out as a sibling
      # directory next to auto_a11y_python.
      - ../pdfMax/python/checker:/opt/pdfmax/checker:ro
