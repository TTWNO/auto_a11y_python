# Dev-only overrides. Docker Compose auto-merges this on top of
# docker-compose.yml, so `docker compose up` (or `podman-compose up`) gets
# live-reload for free.
#
# To run without the dev overrides (e.g. to mimic prod), use:
#   docker compose -f docker-compose.yml up

services:
  app:
    build:
      context: .
      target: dev
      # See docker-compose.yml for the production stage.
    # Run Flask with the reloader. --debug flips config.DEBUG, which run.py
    # forwards into app.run() as use_reloader=True.
    command: python run.py --host 0.0.0.0 --debug
    volumes:
      # Mount the source tree so host edits land in the container.
      - .:/app
      # Override the named volumes from docker-compose.yml so these
      # directories are live on the host too (no shadowing).
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
      - ./data:/app/data
      # Shadow the bind mount for paths that must stay container-owned:
      # the host's .venv (if any) targets the host's OS/Python, and
      # __pycache__ would pollute the host tree.
      - /app/.venv
      - /app/__pycache__
