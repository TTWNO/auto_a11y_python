services:
  app:
    build: .
    container_name: auto-a11y-app
    command: python run.py --host 0.0.0.0
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/auto_a11y
      - BROWSER_MODE=local
      - BROWSER_HEADLESS=True
    # Allow the container to reach HTTP servers running on the host
    # (e.g. http://host.docker.internal:8080). Requires Docker Engine 20.10+
    # or Podman 4.1+. No effect on Docker Desktop, which provides this alias
    # natively.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-reports:/app/reports
      - app-screenshots:/app/screenshots
      - app-data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 2g
    restart: unless-stopped

  mongo:
    image: docker.io/library/mongo:8
    container_name: auto-a11y-mongo
    ports:
      - "27017:27017"
    volumes:
      - /auto_a11y_db:/data/db
    healthcheck:
      test: mongosh --eval "db.runCommand('ping').ok" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

volumes:
  app-reports:
  app-screenshots:
  app-data:
