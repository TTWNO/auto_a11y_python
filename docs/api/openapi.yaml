      - status
      - message
      title: WebsiteDiscoveryStartedOut
      type: object
    WebsiteIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/projects/<id>/websites``.


        ``url`` is required; ``name`` and ``scraping_config`` are optional.

        URL is validated for ``http(s)://`` prefix in the handler (Pydantic''s

        built-in ``HttpUrl`` is not used here to keep the validation rule

        byte-identical to the legacy ``_validate_url`` helper).'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: WebsiteIn
      type: object
    WebsiteListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects/<id>/websites``.


        Uses cursor pagination with the legacy ``items`` / ``next_cursor``

        shape — NOT the generic ``ListEnvelope[T]`` (which uses ``data`` and

        a page/limit pagination block). This matches what the existing

        handler returns and what the frontend reads today.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/WebsiteOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: WebsiteListOut
      type: object
    WebsiteOut:
      additionalProperties: false
      description: 'Response body for single-website GET / POST / PUT / PATCH.


        Mirrors ``_serialize_website()`` byte-for-byte. ``id`` is the

        stringified Mongo ``_id``; ``last_scraped`` and ``last_tested`` may be

        null. ``scraping_config`` is the nested dict produced by

        ``ScrapingConfig.to_dict()``.


        Timestamps are emitted as ISO 8601 strings (Pydantic default), which

        matches the legacy handler''s behaviour for this resource.'
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        display_name:
          title: Display Name
          type: string
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        last_scraped:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Scraped
        last_tested:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Tested
        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Name
        page_count:
          title: Page Count
          type: integer
        project_id:
          title: Project Id
          type: string
        scraping_config:
          $ref: '#/components/schemas/ScrapingConfigModel'
        url:
          title: Url
          type: string
      required:
      - project_id
      - url
      - display_name
      - page_count
      - scraping_config
      title: WebsiteOut
      type: object
    WebsitePatch:
      additionalProperties: false
      description: 'Request body for ``PATCH /api/v1/websites/<id>``.


        Every field is optional; only fields present in the body are applied.

        ``url`` validation runs only when ``url`` is provided.'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Url
      title: WebsitePatch
      type: object
    WebsitePut:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/websites/<id>``.


        PUT is a full replace of editable fields. Server-managed fields

        (``project_id``, ``created_at``, ``last_scraped``, ``last_tested``,

        ``page_count``, ``members``, ``discovery_history``) are preserved

        from the existing record and cannot be set via this endpoint.'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: WebsitePut
      type: object
    WebsiteReportIn:
      additionalProperties: false
      description: 'Request body for queueing a website-scoped report.


        The ``type`` discriminator picks the legacy generator (page-

        structure and discovery are sibling generators of the main

        accessibility report). Only the ``accessibility`` type reads

        ``include_ai`` — the others ignore it.'
      properties:
        format:
          anyOf:
          - enum:
            - xlsx
            - html
            - csv
            - pdf
            - excel
            type: string
          - type: 'null'
          default: null
          title: Format
        include_ai:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include Ai
        type:
          anyOf:
          - enum:
            - accessibility
            - page-structure
            - discovery
            type: string
          - type: 'null'
          default: null
          title: Type
      title: WebsiteReportIn
      type: object
    WebsiteTestRunIn:
      additionalProperties: false
      description: 'Request body for queueing a website-wide batch test.


        All fields optional. ``project_user_ids`` and ``website_user_ids``

        accept a single string or list of strings — the handler reads

        ``project_user_ids`` first, falling back to ``website_user_ids``.


        ``untested_only`` filters the queue to pages still in DISCOVERED.'
      properties:
        max_pages:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Max Pages
        project_user_ids:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Project User Ids
        untested_only:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Untested Only
        website_user_ids:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Website User Ids
      title: WebsiteTestRunIn
      type: object
    WebsiteTestRunStartedOut:
      additionalProperties: false
      description: 'Response body (202) for queueing a website-wide test run.


        Mirrors the legacy ``jsonify`` payload byte-for-byte.'
      properties:
        job_id:
          title: Job Id
          type: string
        message:
          title: Message
          type: string
        pages_queued:
          title: Pages Queued
          type: integer
        status:
          const: queued
          title: Status
          type: string
        total_tests:
          title: Total Tests
          type: integer
        user_count:
          title: User Count
          type: integer
        website_id:
          title: Website Id
          type: string
      required:
      - job_id
      - website_id
      - pages_queued
      - user_count
      - total_tests
      - status
      - message
      title: WebsiteTestRunStartedOut
      type: object
    _PaginationOldShape:
      additionalProperties: false
      description: 'Pagination block for ``GET /projects`` -- legacy shape.


        Differs from ``PaginationMeta`` in ``common.py``: keys are

        ``page``/``limit``/``total`` (no ``per_page``, no ``total_pages``).'
      properties:
        limit:
          title: Limit
          type: integer
        page:
          title: Page
          type: integer
        total:
          title: Total
          type: integer
      required:
      - page
      - limit
      - total
      title: _PaginationOldShape
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: Token
      description: 'API token issued via /auth/tokens. Prefix: a11y_'
      scheme: bearer
      type: http
    sessionAuth:
      description: Flask-Login session cookie.
      in: cookie
      name: session
      type: apiKey
info:
  description: Documented surface for /api/v1/*.
  title: Auto A11y REST API
  version: 1.0.0
openapi: 3.1.0
paths:
  /discovered-pages/{page_id}:
    delete:
      description: Deletes the discovered page. Returns ``204 No Content`` with an
        empty body.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: &id001
          type: string
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Delete a discovered page
      tags:
      - DiscoveredPages
    get:
      description: Returns the discovered page resource.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredPageOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Get a discovered page by ID
      tags:
      - DiscoveredPages
    patch:
      description: Partial update -- only fields present in the request body are applied.
        ``updated_at`` is bumped on every successful PATCH. Returns the full updated
        resource.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveredPagePatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredPageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Partially update a discovered page
      tags:
      - DiscoveredPages
    put:
      description: Full replace of a discovered page's editable fields. Server-managed
        fields (``project_id``, ``source_*``, ``drupal_*``, ``created_at``, ``created_by``)
        are preserved from the existing record; clients cannot reassign a discovered
        page to a different project, change its source, or rewrite Drupal-sync state
        via this endpoint.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveredPagePut'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredPageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Replace a discovered page
      tags:
      - DiscoveredPages
  /jobs/{job_id}/restart:
    post:
      description: Re-queues a (typically failed or cancelled) report-generation job.
        Reads the old job's metadata, files a cancellation request if it is still
        pending/running (the worker thread reads the flag and exits cleanly), and
        submits a fresh job with the same scope/type/format. Currently only ``REPORT_GENERATION``
        jobs are restartable -- other job types either auto-restart (discovery) or
        have side effects that do not make sense to replay (test runs, PDF audits);
        restart of a non-report job returns 400.
      parameters:
      - in: path
        name: job_id
        required: true
        schema: *id001
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRestartOut'
          description: Accepted
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Restart a report-generation job
      tags:
      - Reports
  /pages/{page_id}:
    delete:
      description: Deletes the page and cascades to its test results. Returns ``204
        No Content`` with an empty body.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Delete a page
      tags:
      - Pages
    get:
      description: Returns the page resource (``PageOut``).
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Get a page by ID
      tags:
      - Pages
    patch:
      description: Partial update -- only fields present in the request body are applied.
        Returns the full updated ``PageOut``.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagePatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Partially update a page
      tags:
      - Pages
    put:
      description: Full replace of a page's editable fields. Server-managed fields
        (status, counts, dates, screenshot, drupal sync, discovery metadata) are preserved.
        ``website_id`` and ``url`` are locked -- the (website_id, url) pair is the
        page's identity. A PUT that changes ``url`` is rejected with 400.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagePut'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Replace a page
      tags:
      - Pages
  /pages/{page_id}/matrix:
    get:
      description: Returns the test-state matrix for a page. A page has at most one
        matrix; if none has been saved yet, returns a default in-memory matrix derived
        from the page's currently-enabled multi-state scripts with sequential combinations.
        ``id`` is ``null`` in that case so clients can detect a not-yet-persisted
        matrix.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatrixOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Get the test-state matrix for a page
      tags:
      - Pages
    put:
      description: Full replace of the page's test-state matrix. The ``scripts`` array
        on the persisted matrix is always rebuilt from the page's currently-enabled
        multi-state scripts at save time -- clients don't submit it. ``combinations``
        is required and each value must be ``"before"``, ``"after"``, or ``"none"``.
        ``script_order`` is optional and only repositions scripts already present
        on the page. The verb is PUT because the matrix is an idempotent 1:1 sub-resource
        of the page -- there is no PATCH or DELETE; clearing it means PUTing an empty
        ``combinations`` array.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageMatrixIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatrixOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Replace the test-state matrix for a page
      tags:
      - Pages
  /pages/{page_id}/reports:
    post:
      description: Queues a background job to generate an accessibility report for
        a single page. Returns 202 with the job handle. ``format`` defaults to ``xlsx``;
        ``include_ai`` defaults to true. The page's existence is validated up front
        so the response is a clean 404 (Problem Details) rather than a 202 followed
        by a job that fails on the first generator call.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageReportIn'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreatedOut'
          description: Accepted
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Queue a single-page accessibility report
      tags:
      - Reports
  /pages/{page_id}/test:
    post:
      description: Queues an accessibility test run for a single page. Both ``POST
        /api/v1/pages/<id>/test`` (legacy alias) and the canonical ``POST /api/v1/pages/<id>/test-runs``
        route here. Returns 202 with the queued task's id; the worker runs the test
        in the background. 503 is returned when ``BROWSER_MODE='disabled'`` or ``'remote'``
        rejects the request at the server.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageTestRunIn'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTestRunStartedOut'
          description: Accepted
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
