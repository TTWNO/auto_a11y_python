    get:
      description: Returns the full :class:`AppUser` projection (``role``, ``is_active``,
        ``is_superadmin``, and the user's timestamps) so SPAs can render an authenticated
        profile without a separate ``GET /users/<id>`` call. The richer counterpart
        of ``GET /users/me`` (which is intentionally minimal — id, email, display_name,
        is_superadmin only).
