      description: 'Spins a fresh browser, attempts the project test-user''s login
        automation against the live site, and returns the result inline. Synchronous
        — status 200 (not 202) on both success and failure signals "done synchronously"
        so clients don''t poll a non-existent job. The 500 path carries the same envelope
        shape with ``success=false`` and the error message in ``error``, so clients
        have a single parser regardless of outcome. The browser is closed before returning
        even when login fails or raises — no leaked Playwright instances.


        Errors:


        - **400** — ``login_url`` is not configured and the authentication method
        is not ``manual_login`` (manual login doesn''t need a URL; it pops a visible
        browser for the operator to drive).

        - **404** — user does not exist.

        - **409** — server-side ``BROWSER_MODE`` rules out a local browser (``disabled``
        or ``remote`` — the endpoint has no queueable fallback).

        - **500** — the login automation raised; the body still carries the ``success:
        false`` envelope plus the error message.'
      parameters:
      - in: path
        name: user_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestUserLoginOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
