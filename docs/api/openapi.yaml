      title: TesterPatch
      type: object
    TestingConfigOut:
      additionalProperties: false
      description: "Response body for ``GET /api/v1/testing/config``.\n\nMirrors :func:`_serialize_testing_config`\
        \ byte-for-byte. Every\nfield is concrete on the wire because the helper substitutes\n\
        typed defaults (``0`` / ``False``) for unset config attributes.\n\nField semantics:\n\
        \n- ``parallel_tests`` — number of concurrent browser workers.\n- ``test_timeout``\
        \ — per-page browser timeout in milliseconds.\n- ``run_ai_analysis`` — global\
        \ toggle for Claude visual analysis.\n- ``browser_headless`` — whether Playwright\
        \ runs headless.\n- ``viewport_width`` / ``viewport_height`` — browser viewport\n\
        \  dimensions in pixels.\n- ``pages_per_page`` / ``max_pages_per_page`` —\
        \ admin-UI\n  pagination defaults / upper bound.\n- ``show_error_codes`` —\
        \ developer/debug toggle that surfaces\n  internal error codes in the admin\
        \ UI."
      properties:
        browser_headless:
          title: Browser Headless
          type: boolean
        max_pages_per_page:
          title: Max Pages Per Page
          type: integer
        pages_per_page:
          title: Pages Per Page
          type: integer
        parallel_tests:
          title: Parallel Tests
          type: integer
        run_ai_analysis:
          title: Run Ai Analysis
          type: boolean
        show_error_codes:
          title: Show Error Codes
          type: boolean
        test_timeout:
          title: Test Timeout
          type: integer
        viewport_height:
          title: Viewport Height
          type: integer
        viewport_width:
          title: Viewport Width
          type: integer
      required:
      - parallel_tests
      - test_timeout
      - run_ai_analysis
      - browser_headless
      - viewport_width
      - viewport_height
      - pages_per_page
      - max_pages_per_page
      - show_error_codes
      title: TestingConfigOut
      type: object
    TestingConfigPatchIn:
      additionalProperties: true
      description: 'Request body for ``PUT /api/v1/testing/config``.


        Free-form ``dict[str, object]`` rather than a typed model so the

        handler can preserve the legacy 400 wire shape on unknown keys

        (``{field, code: "unknown_field", message: "unknown config key"}``

        in the ``errors`` array). Pydantic''s ``extra=''forbid''`` would

        emit a different error envelope (``extra_forbidden`` on a ``loc``

        path) and break in-flight admin frontends.


        The same RootModel pattern is used by

        :class:`auto_a11y.web.api.schemas.admin.GenericSectionPatchIn`

        for the admin-settings PATCH surface, which has the same

        "valid-keys list lives in a runtime registry" constraint. The

        OpenAPI surface for this endpoint is therefore a free-form

        object; consumers should consult :class:`TestingConfigOut` for

        the documented field list.


        PUT here is *partial*: any subset of the documented keys is

        accepted; missing keys are left untouched (the legacy POST

        handler was already partial-update; we preserve that semantics).

        Per-key type validation (``isinstance(value, bool)`` and

        ``isinstance(value, int)`` excluding ``bool``-as-int) happens in

        the handler so the error wire shape stays consistent with the

        legacy ``invalid_type`` field-error code.'
      title: TestingConfigPatchIn
      type: object
    TestingStatsOut:
      additionalProperties: true
      description: 'Response body for ``GET /api/v1/testing/stats``.


        The shape varies per scope: website-scoped responses always carry

        ``website_count``, ``total_pages``, ``tested_pages``,

        ``untested_pages``, ``total_violations``, ``total_warnings``,

        ``test_coverage``; project- and global-scoped responses surface

        whatever :func:`get_project_stats` / :func:`calculate_aggregate_stats`

        returns. ``completed_today`` is appended unconditionally by the

        handler. Wrapping as a RootModel keeps the wire body the bare object

        the legacy clients expect while preserving the @document contract.'
      title: TestingStatsOut
      type: object
    TopLevelTestRunIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/test-runs``.


        Top-level form of the per-page ``POST /api/v1/pages/<id>/test-runs``

        that takes the page id in the body instead of the URL. ``page_id``

        is required; the other fields mirror :class:`PageTestRunIn` from

        ``test_runs.py``.


        ``enable_multi_state`` uses strict bool validation: Pydantic''s lax

        default would coerce the string ``"yes"`` (and other truthy strings)

        to ``True``, but the test orchestration surface treats those as a

        typo and 400s them so the caller fixes the wire shape.'
      properties:
        enable_multi_state:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Enable Multi State
        page_id:
          title: Page Id
          type: string
        website_user_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Website User Id
      required:
      - page_id
      title: TopLevelTestRunIn
      type: object
    TopLevelTestRunOut:
      additionalProperties: false
      description: 'Response body (202) for ``POST /api/v1/test-runs``.


        Mirrors the legacy ``jsonify`` payload byte-for-byte: same shape

        as :class:`PageTestRunStartedOut` from ``test_runs.py`` but

        duplicated rather than re-imported so the two endpoints can

        diverge independently (e.g. the top-level form could grow a

        ``submitted_by`` echo without forcing it onto the per-page route).'
      properties:
        job_id:
          title: Job Id
          type: string
        multi_state:
          title: Multi State
          type: boolean
        page_id:
          title: Page Id
          type: string
        status:
          const: queued
          title: Status
          type: string
      required:
      - job_id
      - page_id
      - multi_state
      - status
      title: TopLevelTestRunOut
      type: object
    TrendPointOut:
      additionalProperties: false
      description: 'One day of trend data in the ``trend_data`` array.


        Shape mirrors :func:`get_trend_data`''s entries: a date string plus

        integer counters. The legacy helper always emits ``violations``,

        ``warnings``, ``tests``; ``tests`` defaults to 0 so older fixtures

        that never received traffic round-trip cleanly.'
      properties:
        date:
          title: Date
          type: string
        tests:
          default: 0
          title: Tests
          type: integer
        violations:
          title: Violations
          type: integer
        warnings:
          title: Warnings
          type: integer
      required:
      - date
      - violations
      - warnings
      title: TrendPointOut
      type: object
    TrendsCompareOut:
      additionalProperties: true
      description: 'Response body for ``GET /api/v1/test-runs/trends/compare``.


        Period-vs-period comparison output from :func:`compare_periods`. The

        nested period blocks carry the same shape as the detailed endpoint;

        the outer envelope adds the summary deltas. RootModel preserves the

        bare object on the wire.'
      title: TrendsCompareOut
      type: object
    TrendsDetailedOut:
      additionalProperties: true
      description: 'Response body for ``GET /api/v1/test-runs/trends/detailed``.


        The legacy :func:`get_detailed_trend_data` returns a dict whose key

        set varies with ``granularity``, ``include_breakdown``, and the

        filter arrays. RootModel keeps the bare wire body the legacy

        clients expect.'
      title: TrendsDetailedOut
      type: object
    TrendsOut:
      additionalProperties: false
      description: Response body for ``GET /api/v1/test-runs/trends``.
      properties:
        days:
          maximum: 365
          minimum: 1
          title: Days
          type: integer
        trend_data:
          items:
            $ref: '#/components/schemas/TrendPointOut'
          title: Trend Data
          type: array
      required:
      - days
      - trend_data
      title: TrendsOut
      type: object
    TrendsProgressOut:
      additionalProperties: true
      description: 'Response body for ``GET /api/v1/test-runs/trends/progress``.


        :func:`calculate_progress_metrics` returns a free-form dict whose

        keys depend on whether the scope yields tested-page snapshots,

        historical comparisons, or both. RootModel passes the body through

        as a bare object (no ``data`` envelope), matching the legacy

        handler.'
      title: TrendsProgressOut
      type: object
    UserSearchListOut:
      additionalProperties: false
      description: 'Response body for ``GET /users/search``.


        Non-paginated ``{users: [...]}`` shape. The results are capped at

        20 entries server-side; queries shorter than 2 characters return

        an empty list rather than 400 to keep the autocomplete UX smooth.'
      properties:
        users:
          items:
            $ref: '#/components/schemas/UserSearchOut'
          title: Users
          type: array
      required:
      - users
      title: UserSearchListOut
      type: object
    UserSearchOut:
      additionalProperties: false
      description: 'Single hit on the ``/users/search`` autocomplete endpoint.


        Deliberately narrow — this endpoint exists for picking a user when

        adding a project member, so it surfaces only the email, display

        name, and id. The full AppUser surface (password hash, SSO ids,

        last_login, etc.) is out of scope for this endpoint by design.


        ``display_name`` is optional because AppUser allows it to be unset

        (the UI falls back to the email). ``user_id`` is typed

        ``Optional[str]`` because the underlying ``AppUser.id`` is

        ``Optional[str]`` (transient unsaved users return ``None``); in

        practice the search endpoint only returns persisted users so the

        field is always set, but the type preserves byte-for-byte wire

        parity with the legacy ``_serialize_app_user_search_hit``.'
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Display Name
        email:
          title: Email
          type: string
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: User Id
      required:
      - email
      title: UserSearchOut
      type: object
    WebsiteDiscoveryIn:
      additionalProperties: false
      description: 'Request body for queueing a website discovery crawl.


        All fields are optional. ``max_pages`` is coerced to a positive int

        by the handler (non-positive / non-int values silently degrade to

        None). Both ``project_user_ids`` and ``website_user_ids`` are

        accepted for backwards-compat; the handler reads

        ``project_user_ids`` first, falling back to ``website_user_ids``.


        Each ``*_user_ids`` field accepts either a single string or a list

        of strings — the legacy handler tolerates both, and we mirror that

        here via ``str | list[str]``.'
      properties:
        max_pages:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Max Pages
        project_user_ids:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Project User Ids
        website_user_ids:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Website User Ids
      title: WebsiteDiscoveryIn
      type: object
    WebsiteDiscoveryStartedOut:
      additionalProperties: false
      description: 'Response body (202) for queueing a website discovery crawl.


        Mirrors the legacy ``jsonify`` payload. ``max_pages`` is the

        coerced crawl cap (``None`` when unbounded).'
      properties:
        job_id:
          title: Job Id
          type: string
        max_pages:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Max Pages
        message:
          title: Message
          type: string
        status:
          const: started
          title: Status
          type: string
        user_count:
          title: User Count
          type: integer
        website_id:
          title: Website Id
          type: string
      required:
      - job_id
      - website_id
      - user_count
      - status
      - message
      title: WebsiteDiscoveryStartedOut
      type: object
    WebsiteIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/projects/<id>/websites``.


        ``url`` is required; ``name`` and ``scraping_config`` are optional.

        URL is validated for ``http(s)://`` prefix in the handler (Pydantic''s

        built-in ``HttpUrl`` is not used here to keep the validation rule

        byte-identical to the legacy ``_validate_url`` helper).'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: WebsiteIn
      type: object
    WebsiteListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects/<id>/websites``.


        Uses cursor pagination with the legacy ``items`` / ``next_cursor``

        shape — NOT the generic ``ListEnvelope[T]`` (which uses ``data`` and

        a page/limit pagination block). This matches what the existing

        handler returns and what the frontend reads today.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/WebsiteOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: WebsiteListOut
      type: object
    WebsiteOut:
      additionalProperties: false
      description: 'Response body for single-website GET / POST / PUT / PATCH.


        Mirrors ``_serialize_website()`` byte-for-byte. ``id`` is the

        stringified Mongo ``_id``; ``last_scraped`` and ``last_tested`` may be

        null. ``scraping_config`` is the nested dict produced by

        ``ScrapingConfig.to_dict()``.


        Timestamps are emitted as ISO 8601 strings (Pydantic default), which

        matches the legacy handler''s behaviour for this resource.'
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        display_name:
          title: Display Name
          type: string
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        last_scraped:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Scraped
        last_tested:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Tested
        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Name
        page_count:
          title: Page Count
          type: integer
        project_id:
          title: Project Id
          type: string
        scraping_config:
          $ref: '#/components/schemas/ScrapingConfigModel'
        url:
          title: Url
          type: string
      required:
      - project_id
      - url
      - display_name
      - page_count
      - scraping_config
      title: WebsiteOut
      type: object
    WebsitePatch:
      additionalProperties: false
      description: 'Request body for ``PATCH /api/v1/websites/<id>``.


        Every field is optional; only fields present in the body are applied.

        ``url`` validation runs only when ``url`` is provided.'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Url
      title: WebsitePatch
      type: object
    WebsitePut:
      description: 'Request body for ``PUT /api/v1/websites/<id>``.


        PUT is a full replace of editable fields. Server-managed fields

        (``project_id``, ``created_at``, ``last_scraped``, ``last_tested``,

        ``page_count``, ``members``, ``discovery_history``) are preserved

        from the existing record and cannot be set via this endpoint.'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: WebsitePut
      type: object
    WebsiteReportIn:
      additionalProperties: false
      description: 'Request body for queueing a website-scoped report.


        The ``type`` discriminator picks the legacy generator (page-

        structure and discovery are sibling generators of the main

        accessibility report). Only the ``accessibility`` type reads

        ``include_ai`` — the others ignore it.'
      properties:
        format:
          anyOf:
          - enum:
            - xlsx
            - html
            - csv
            - pdf
            - excel
            type: string
          - type: 'null'
          default: null
          title: Format
        include_ai:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include Ai
        type:
          anyOf:
          - enum:
            - accessibility
            - page-structure
            - discovery
            type: string
          - type: 'null'
          default: null
          title: Type
      title: WebsiteReportIn
      type: object
    WebsiteTestResultsClearedOut:
      additionalProperties: false
      description: 'Response body for ``DELETE /api/v1/websites/<id>/test-results``.


        Wipes every test-result document for the website''s pages and

        resets their cached counters; mirrors the counts returned by

        :meth:`Database.clear_website_test_results`. Returned with status

        200 (the operation deletes child records but the website itself

        is preserved). ``website_id`` is echoed back so callers can render

        UI keyed on the resource without having to track which request

        they made.'
      properties:
        pages_reset:
          title: Pages Reset
          type: integer
        pdf_documents_reset:
          title: Pdf Documents Reset
          type: integer
        test_results_deleted:
          title: Test Results Deleted
          type: integer
        website_id:
          title: Website Id
          type: string
      required:
      - website_id
      - test_results_deleted
      - pages_reset
      - pdf_documents_reset
      title: WebsiteTestResultsClearedOut
      type: object
    WebsiteTestRunIn:
      additionalProperties: false
      description: 'Request body for queueing a website-wide batch test.


        All fields optional. ``project_user_ids`` and ``website_user_ids``

        accept a single string or list of strings — the handler reads

        ``project_user_ids`` first, falling back to ``website_user_ids``.


        ``untested_only`` filters the queue to pages still in DISCOVERED.


        ``take_screenshot`` and ``run_ai`` are per-run overrides applied

        uniformly across every page queued by this batch. ``None`` keeps

        the runner''s defaults.'
      properties:
        max_pages:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Max Pages
        project_user_ids:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Project User Ids
        run_ai:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Run Ai
        take_screenshot:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Take Screenshot
        untested_only:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Untested Only
        website_user_ids:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Website User Ids
      title: WebsiteTestRunIn
      type: object
    WebsiteTestRunStartedOut:
      additionalProperties: false
      description: 'Response body (202) for queueing a website-wide test run.


        Mirrors the legacy ``jsonify`` payload byte-for-byte.'
      properties:
        job_id:
          title: Job Id
          type: string
        message:
          title: Message
          type: string
        pages_queued:
          title: Pages Queued
          type: integer
        status:
          const: queued
          title: Status
          type: string
        total_tests:
          title: Total Tests
          type: integer
        user_count:
          title: User Count
          type: integer
        website_id:
          title: Website Id
          type: string
      required:
      - job_id
      - website_id
      - pages_queued
      - user_count
      - total_tests
      - status
      - message
      title: WebsiteTestRunStartedOut
      type: object
    WebsiteTestUserListOut:
      additionalProperties: false
      description: 'Response body for ``GET /websites/<website_id>/test-users``.


        Non-paginated ``{items: [...]}`` envelope. Same reasoning as

        :class:`ProjectTestUserListOut`.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/WebsiteTestUserOut'
          title: Items
          type: array
      required:
      - items
      title: WebsiteTestUserListOut
      type: object
    WebsiteTestUserOut:
      additionalProperties: false
      description: 'Response shape for a single website-scoped test user.


        Mirrors :func:`_serialize_website_test_user` byte-for-byte. The

        only difference from :class:`ProjectTestUserOut` is the parent

        foreign-key field (``website_id`` instead of ``project_id``).'
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Description
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Display Name
        enabled:
          title: Enabled
          type: boolean
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        last_login_error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Login Error
        last_login_success:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Last Login Success
        last_used:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Used
        login_config:
          $ref: '#/components/schemas/LoginConfigOut'
        password_set:
          title: Password Set
          type: boolean
        roles:
          items:
            type: string
          title: Roles
          type: array
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Updated At
        username:
          title: Username
          type: string
        website_id:
          title: Website Id
          type: string
      required:
      - website_id
      - username
      - password_set
      - roles
      - login_config
      - enabled
      title: WebsiteTestUserOut
      type: object
    WebsitesListBareOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/websites``.


        Bare ``{items}`` envelope (no pagination). The top-level listing

        requires ``?project_id=`` for non-superadmin callers, so the

        expected row count is the number of websites in a single project —

        a few dozen at most. Adding cursor pagination here is deferred

        until somebody actually has that many.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/WebsiteOut'
          title: Items
          type: array
      required:
      - items
      title: WebsitesListBareOut
      type: object
    _PaginationOldShape:
      additionalProperties: false
      description: 'Pagination block for ``GET /projects`` -- legacy shape.


        Differs from ``PaginationMeta`` in ``common.py``: keys are

        ``page``/``limit``/``total`` (no ``per_page``, no ``total_pages``).'
      properties:
        limit:
          title: Limit
          type: integer
        page:
          title: Page
          type: integer
        total:
          title: Total
          type: integer
      required:
      - page
      - limit
      - total
      title: _PaginationOldShape
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: Token
      description: 'API token issued via /auth/tokens. Prefix: a11y_'
      scheme: bearer
      type: http
    sessionAuth:
      description: Flask-Login session cookie.
      in: cookie
      name: session
      type: apiKey
info:
  description: Documented surface for /api/v1/*.
  title: Auto A11y REST API
  version: 1.0.0
openapi: 3.1.0
paths:
  /admin/settings:
    get:
      description: 'Returns the entire runtime configuration: the special-cased ``drupal``
        section plus every entry in ``CONFIG_SECTIONS`` (SMTP, LDAP, etc.). Each generic
        section''s ``values`` block is keyed by ``db_key`` from the section schema;
        password fields surface as ``null`` with a sibling ``<key>_set: bool`` so
        callers can render a "[set]" indicator without us echoing secrets. ``source``
        on each section reports where the effective values came from (database / environment
        / default). Superadmin-only.'
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettingsOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
