        job to CANCELLED and stamps a ``''Job cleared by administrator''`` error.
        Also resets every page stuck in QUEUED or TESTING back to DISCOVERED. Returns
        the per-bucket counts and a human-readable message. Idempotent — calling this
        with no active jobs is a no-op and returns zero counts.'
