    FixtureTestStatusEntry:
      additionalProperties: false
      description: "Per-error-code entry in :class:`FixtureTestStatusOut.test_statuses`.\n\
        \nMirrors the projection from\n:meth:`FixtureValidator.get_test_status` field-for-field:\n\
        \n- ``success`` — ``True`` iff every fixture for this code passed.\n- ``status_category``\
        \ — ``\"all_pass\"`` / ``\"partial_pass\"`` /\n  ``\"all_fail\"``. Typed loosely\
        \ as ``str`` so a future fourth\n  category (e.g. ``\"no_fixtures\"``) doesn't\
        \ force a schema bump.\n- ``total_fixtures`` / ``passed_fixtures`` — fixture\
        \ counts for\n  this code.\n- ``fixture_paths`` — every fixture path scoped\
        \ to this code.\n- ``fixture_path`` — back-compat field; the validator emits\
        \ a\n  summary string like ``\"3 fixtures\"`` here for old consumers.\n- ``notes``\
        \ — per-failure notes appended by the validator when\n  the code is not all-pass.\n\
        - ``tested_at`` — ISO 8601 timestamp; the handler converts from\n  the raw\
        \ ``datetime`` returned by the validator.\n- ``found_codes`` — currently always\
        \ ``[]``; the validator\n  reserves this for future aggregation. Typed as\n\
        \  ``list[object]`` so the door stays open without committing\n  to an element\
        \ shape."
      properties:
