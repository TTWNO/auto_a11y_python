        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        is_system:
          title: Is System
          type: boolean
        name:
          title: Name
          type: string
        permissions:
          additionalProperties:
            type: string
          title: Permissions
          type: object
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Updated At
      required:
