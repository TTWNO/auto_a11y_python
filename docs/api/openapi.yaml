          - type: 'null'
          default: null
          title: Id
        is_valid:
          title: Is Valid
          type: boolean
        label:
          title: Label
          type: string
        last_used:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Used
        revoked:
          title: Revoked
          type: boolean
        revoked_at:
