      additionalProperties: false
      description: Generic single-message response (used by the PUT handler).
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: MessageOut
      type: object
    PageIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/websites/<id>/pages``.


        ``url`` is required; ``title``, ``priority``, and ``setup_script_id``

        are optional. URL is validated for the ``http(s)://`` prefix in the

        handler (matching the legacy ``_validate_url`` rule).'
      properties:
        priority:
          anyOf:
          - enum:
            - high
            - normal
            - low
            type: string
          - type: 'null'
          default: null
          title: Priority
        setup_script_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Setup Script Id
        title:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          default: null
          title: Title
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: PageIn
      type: object
    PageListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/websites/<id>/pages``.


        Cursor-paginated; same shape as the websites list.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/PageOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: PageListOut
      type: object
    PageMatrixIn:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/pages/<id>/matrix``.


        ``combinations`` is required: a list of ``{script_id: state}`` dicts

        where each value must be ``"before"``, ``"after"``, or ``"none"``.

        The handler additionally validates the inner state strings (since

        Pydantic cannot constrain values inside a free-form ``dict[str, str]``

        field at schema generation time without losing the arbitrary

        script-id key shape).


        ``script_order`` is optional and only repositions scripts already

        present on the page; entries for script IDs the page does not

        currently have are silently ignored by the handler.'
      properties:
        combinations:
          items:
            additionalProperties:
              type: string
            type: object
          title: Combinations
          type: array
        script_order:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScriptOrderEntry'
            type: array
          - type: 'null'
          default: null
          title: Script Order
      required:
      - combinations
      title: PageMatrixIn
      type: object
    PageMatrixOut:
      additionalProperties: false
      description: 'Response body for matrix GET / PUT.


        Mirrors ``_serialize_test_state_matrix()``. ``id`` is null when the

        matrix has not been persisted yet (the GET handler returns a

        derived in-memory default the first time the endpoint is hit).'
      properties:
        combinations:
          items:
            additionalProperties:
              type: string
            type: object
          title: Combinations
          type: array
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created By
        created_date:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created Date
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        last_modified:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Modified
        page_id:
          title: Page Id
          type: string
        scripts:
          items:
            $ref: '#/components/schemas/ScriptStateDefinitionOut'
          title: Scripts
          type: array
        website_id:
          title: Website Id
          type: string
      required:
      - page_id
      - website_id
      - scripts
      - combinations
      title: PageMatrixOut
      type: object
    PageOut:
      additionalProperties: false
      description: 'Response body for single-page GET / POST / PUT / PATCH.


        Mirrors ``_serialize_page()`` byte-for-byte. ``id`` is the stringified

        Mongo ``_id``; timestamps are ISO 8601. Drupal-sync fields are

        intentionally excluded from this surface (the legacy serializer

        omitted them too).'
      properties:
