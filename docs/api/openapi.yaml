    PdfUploadIn:
      additionalProperties: false
      description: "Form fields for the multipart upload of a PDF document.\n\nThe\
        \ file part ``pdf_file`` is declared via\n``@document(request_files=[\"pdf_file\"\
        ])`` and arrives in the handler\nas a :class:`werkzeug.datastructures.FileStorage`\
        \ kwarg.\n\nTwo request shapes share the underlying endpoint:\n\n1. **multipart/form-data**\
        \ — ``pdf_file`` part with the raw PDF\n   bytes plus ``website_id`` selecting\
        \ which website in the project\n   to attach the document to. ``original_filename``\
        \ is optional and\n   overrides the file part's ``filename`` attribute.\n\
        2. **application/json** — ``{website_id, source_url[, website_user_id]}``.\n\
        \   The server fetches the URL and creates a PDF document from the\n   response\
        \ body.\n\nBecause OpenAPI describes one request body media type per operation\n\
        and ``@document`` only takes one of ``request=``/``request_form=``,\nwe model\
        \ the multipart shape here and let the handler dispatch by\n``Content-Type``\
        \ at runtime. Every field is ``Optional`` so the JSON\nrequest path — which\
        \ posts no form fields at all — still passes the\ndecorator's ``request_form``\
        \ validation against an empty form dict.\nThe handler enforces the real per-content-type\
        \ requireds in its own\nlogic and surfaces them as 400 with a structured ``field``\
        \ errors\nlist."
