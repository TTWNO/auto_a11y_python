          - type: 'null'
          default: null
          title: Tested At
        violations:
          items:
            additionalProperties: true
            type: object
          title: Violations
          type: array
        warnings:
          items:
            additionalProperties: true
            type: object
          title: Warnings
          type: array
      required:
