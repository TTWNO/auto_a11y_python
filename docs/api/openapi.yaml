        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Name
        permissions:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          default: null
          title: Permissions
      title: GroupPut
      type: object
    HealthOut:
      additionalProperties: false
      description: "Response body for ``GET /health``.\n\nMirrors the legacy ``health_check``\
