      description: 'Adds a PDF to a project. Accepts two request shapes:


        1. **multipart/form-data** — ``pdf_file`` part with the raw PDF bytes plus
        a ``website_id`` form field selecting which website in the project to attach
        the document to. Optional ``original_filename`` form field overrides the part''s
        ``filename`` attribute.


