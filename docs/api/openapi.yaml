components:
  schemas:
    Empty:
      additionalProperties: false
      description: Empty body — for 204 responses or endpoints that return ``{}``.
      properties: {}
      title: Empty
      type: object
    MessageOut:
      additionalProperties: false
      description: Generic single-message response (used by the PUT handler).
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: MessageOut
      type: object
    Problem:
      additionalProperties: false
      description: RFC 7807 Problem Details for HTTP APIs.
      properties:
        detail:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Detail
        errors:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Errors
        instance:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Instance
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          default: about:blank
          title: Type
          type: string
      required:
      - title
      - status
      title: Problem
      type: object
    ProjectCreatedOut:
      additionalProperties: false
      description: 'Response body for ``POST /api/v1/projects`` (current wire shape).


        The legacy handler returns ``{"id": <new_id>, "message": "..."}`` --

        NOT the full project resource. Preserved here byte-for-byte.'
      properties:
        id:
          title: Id
          type: string
        message:
          title: Message
          type: string
      required:
      - id
      - message
      title: ProjectCreatedOut
      type: object
    ProjectDictOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects/<id>``.


        The legacy handler returns ``Project.to_dict()`` merged with a

        ``statistics`` top-level key. We model the top-level structure here

        so the OpenAPI spec lists the keys clients should expect; the deeply

        nested fields (testers, supervisors, members, config, statistics)

        use ``dict[str, object]`` because their shapes are tracked in the

        dataclasses in ``auto_a11y.models`` and will be properly typed when

        §5.11 Members lands.'
      properties:
        _id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        app_identifier:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: App Identifier
        config:
          additionalProperties: true
          title: Config
          type: object
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Description
        device_model:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Device Model
        drupal_audit_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Drupal Audit Name
        lived_experience_testers:
          items:
            additionalProperties: true
            type: object
          title: Lived Experience Testers
          type: array
        location:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Location
        members:
          items:
            additionalProperties: true
            type: object
          title: Members
          type: array
        name:
          title: Name
          type: string
        project_type:
          title: Project Type
          type: string
        recording_ids:
          items:
            type: string
          title: Recording Ids
          type: array
        statistics:
          additionalProperties: true
          title: Statistics
          type: object
        status:
          title: Status
          type: string
        tags:
          items:
            type: string
          title: Tags
          type: array
        test_supervisors:
          items:
            additionalProperties: true
            type: object
          title: Test Supervisors
          type: array
        updated_at:
          format: date-time
          title: Updated At
          type: string
        website_ids:
          items:
            type: string
          title: Website Ids
          type: array
      required:
      - name
      - status
      - project_type
      - created_at
      - updated_at
      - statistics
      title: ProjectDictOut
      type: object
    ProjectIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/projects``.


        Mirrors the keys the existing handler reads from ``request.get_json()``:

        ``name`` (required), ``description`` (optional), ``config`` (optional).

        Unknown keys are rejected by ``StrictModel`` (``extra=''forbid''``); the

        legacy handler silently dropped them, so this is a small input-side

        tightening that the v1 surface deliberately commits to.'
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Config
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: ''
          title: Description
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: ProjectIn
      type: object
    ProjectListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects`` (current wire shape).


        Deviates from the generic ``ListEnvelope[T]`` in ``common.py``: the

        legacy handler uses ``"projects"`` (not ``"data"``) and a flat

        ``page/limit/total`` pagination block (not the four-key

        ``PaginationMeta``). The frontend reads this exact shape today.'
      properties:
        pagination:
          $ref: '#/components/schemas/_PaginationOldShape'
        projects:
          items:
            additionalProperties: true
            type: object
          title: Projects
          type: array
      required:
      - projects
      - pagination
      title: ProjectListOut
      type: object
    ProjectPatch:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/projects/<id>``.


        The existing handler treats every field as optional and applies only

        the fields present in the payload -- closer to PATCH semantics. The

        name reflects that; the route still uses ``PUT`` for wire-compat.'
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Config
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Description
        name:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Name
        status:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Status
      title: ProjectPatch
      type: object
    _PaginationOldShape:
      additionalProperties: false
      description: 'Pagination block for ``GET /projects`` -- legacy shape.


        Differs from ``PaginationMeta`` in ``common.py``: keys are

        ``page``/``limit``/``total`` (no ``per_page``, no ``total_pages``).'
      properties:
        limit:
          title: Limit
          type: integer
        page:
          title: Page
          type: integer
        total:
          title: Total
          type: integer
      required:
      - page
      - limit
      - total
      title: _PaginationOldShape
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: Token
      description: 'API token issued via /auth/tokens. Prefix: a11y_'
      scheme: bearer
      type: http
    sessionAuth:
      description: Flask-Login session cookie.
      in: cookie
      name: session
      type: apiKey
info:
  description: Documented surface for /api/v1/*.
  title: Auto A11y REST API
  version: 1.0.0
openapi: 3.1.0
paths:
  /projects:
    get:
      description: Returns the projects visible to the caller (member-of-project filtering
        for non-superadmins). Pagination uses page/limit; ``total`` reflects the unfiltered
        project count.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: List projects
      tags:
      - Projects
    post:
      description: Creates a new project. The caller is auto-added as a project admin
        if authenticated. Returns ``{id, message}`` -- not the full project resource
        (wire-compat with the legacy handler).
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreatedOut'
          description: Created
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Create a project
      tags:
      - Projects
  /projects/{project_id}:
    delete:
      description: Deletes the project. The legacy handler returned status 204 with
        a message body; per HTTP semantics 204 has no body so the message was silently
        dropped. This handler returns ``204 No Content`` with an empty body -- byte-identical
        on the wire.
      parameters:
      - in: path
        name: project_id
        required: true
        schema: &id001
          type: string
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Delete a project
      tags:
      - Projects
    get:
      description: Returns the project payload (mirroring ``Project.to_dict()``) with
        a top-level ``statistics`` block from ``Database.get_project_stats``.
      parameters:
      - in: path
        name: project_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDictOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Get a project by ID
      tags:
      - Projects
    put:
      description: Partial update -- only fields present in the body are applied.
        Returns ``{message}`` (wire-compat with the legacy handler).
      parameters:
      - in: path
        name: project_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Update a project
      tags:
      - Projects
servers:
- description: Live
  url: /api/v1
