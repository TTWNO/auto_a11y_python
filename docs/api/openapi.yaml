        \ true\n  every test is forcibly marked available regardless of fixture\n\
        \  state.\n- ``fixture_run_summary`` — last fixture-run summary, or\n  ``null``\
        \ when no runs are recorded.\n- ``passing_tests`` — error codes that have\
        \ every fixture\n  passing. The legacy handler returns this as a JSON array\
        \ even\n  though it's a set server-side; ``list[str]`` matches.\n- ``test_statuses``\
        \ — per-code status keyed by error code.\n- ``total_tests`` — ``len(test_statuses)``.\n\
        - ``passing_count`` — ``len(passing_tests)``.\n- ``all_pass_count`` / ``partial_pass_count``\
        \ / ``all_fail_count``\n  — pre-computed category counts."
