        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsClearAllOut'
          description: OK
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Clear all running and pending jobs
      tags:
      - Jobs
