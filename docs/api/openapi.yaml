        \ — ``True`` if the user's authentication\n  method is ``manual_login`` (the\
        \ operator drives a visible\n  browser by hand).\n- ``wait_seconds`` — for\
        \ manual login, the per-attempt timeout\n  in seconds; ``None`` for non-manual\
        \ methods (the handler uses\n  a fixed 30-second default that is not exposed\
        \ on the wire)."
      properties:
        duration_ms:
          title: Duration Ms
          type: integer
        error:
          anyOf:
