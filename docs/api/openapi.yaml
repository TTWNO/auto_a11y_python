          - type: 'null'
          default: null
          title: Screenshot Path
        setup_script_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Setup Script Id
        status:
          title: Status
          type: string
        test_duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Test Duration Ms
        title:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Title
        url:
          title: Url
          type: string
        violation_count:
          title: Violation Count
          type: integer
        warning_count:
          title: Warning Count
          type: integer
        website_id:
          title: Website Id
          type: string
      required:
