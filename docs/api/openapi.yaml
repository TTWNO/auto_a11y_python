          type: array
        location:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Location
        members:
          items:
            additionalProperties: true
            type: object
          title: Members
          type: array
        name:
          title: Name
          type: string
        project_type:
          title: Project Type
          type: string
        recording_ids:
          items:
            type: string
          title: Recording Ids
          type: array
        statistics:
          additionalProperties: true
          title: Statistics
          type: object
        status:
          title: Status
          type: string
        tags:
          items:
            type: string
          title: Tags
          type: array
        test_supervisors:
          items:
            additionalProperties: true
            type: object
          title: Test Supervisors
          type: array
        updated_at:
          format: date-time
          title: Updated At
          type: string
        website_ids:
          items:
            type: string
          title: Website Ids
          type: array
      required:
      - name
      - status
      - project_type
      - created_at
      - updated_at
      - statistics
      title: ProjectDictOut
      type: object
    ProjectIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/projects``.


        Mirrors the keys the existing handler reads from ``request.get_json()``:

        ``name`` (required), ``description`` (optional), ``config`` (optional).

        Unknown keys are rejected by ``StrictModel`` (``extra=''forbid''``); the

        legacy handler silently dropped them, so this is a small input-side

        tightening that the v1 surface deliberately commits to.'
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Config
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: ''
          title: Description
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: ProjectIn
      type: object
    ProjectListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects`` (current wire shape).


        Deviates from the generic ``ListEnvelope[T]`` in ``common.py``: the

        legacy handler uses ``"projects"`` (not ``"data"``) and a flat

        ``page/limit/total`` pagination block (not the four-key

        ``PaginationMeta``). The frontend reads this exact shape today.'
      properties:
        pagination:
          $ref: '#/components/schemas/_PaginationOldShape'
        projects:
          items:
            additionalProperties: true
            type: object
          title: Projects
          type: array
      required:
      - projects
      - pagination
      title: ProjectListOut
      type: object
    ProjectPatch:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/projects/<id>``.


        The existing handler treats every field as optional and applies only

        the fields present in the payload -- closer to PATCH semantics. The

        name reflects that; the route still uses ``PUT`` for wire-compat.'
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Config
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Description
        name:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Name
        status:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Status
      title: ProjectPatch
      type: object
    ScrapingConfigModel:
      additionalProperties: false
      description: 'Schema for ``ScrapingConfig`` — used in both request and response
        bodies.


        Mirrors the dataclass in ``auto_a11y.models.website.ScrapingConfig``.

        All fields are optional on input (defaults fill in missing values via

        ``ScrapingConfig()`` in the handler); on output every field is always

        populated because ``ScrapingConfig.to_dict()`` emits all of them.'
      properties:
        allowed_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Allowed Paths
        auto_fetch_pdfs:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Auto Fetch Pdfs
        excluded_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Excluded Paths
        follow_external:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Follow External
        include_subdomains:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include Subdomains
        max_depth:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Max Depth
        max_pages:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Max Pages
        request_delay:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Request Delay
        respect_robots:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Respect Robots
      title: ScrapingConfigModel
      type: object
    ScriptOrderEntry:
      additionalProperties: false
      description: 'One ``{script_id, execution_order}`` row in the PUT body''s

        optional ``script_order`` array.


        The legacy handler validates the same two fields with explicit

        type/required checks; the Pydantic constraints capture both.'
      properties:
        execution_order:
          title: Execution Order
          type: integer
        script_id:
          minLength: 1
          title: Script Id
          type: string
      required:
      - script_id
      - execution_order
      title: ScriptOrderEntry
      type: object
    ScriptStateDefinitionOut:
      additionalProperties: false
      description: 'Output entry for a single script row in the page test-state matrix.


        Mirrors :meth:`ScriptStateDefinition.to_dict`.'
      properties:
        execution_order:
          title: Execution Order
          type: integer
        script_id:
          title: Script Id
          type: string
        script_name:
          title: Script Name
          type: string
        test_after:
          title: Test After
          type: boolean
        test_before:
          title: Test Before
          type: boolean
      required:
      - script_id
      - script_name
      - test_before
      - test_after
      - execution_order
      title: ScriptStateDefinitionOut
      type: object
    WebsiteIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/projects/<id>/websites``.


        ``url`` is required; ``name`` and ``scraping_config`` are optional.

        URL is validated for ``http(s)://`` prefix in the handler (Pydantic''s

        built-in ``HttpUrl`` is not used here to keep the validation rule

        byte-identical to the legacy ``_validate_url`` helper).'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: WebsiteIn
      type: object
    WebsiteListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects/<id>/websites``.


        Uses cursor pagination with the legacy ``items`` / ``next_cursor``

        shape — NOT the generic ``ListEnvelope[T]`` (which uses ``data`` and

        a page/limit pagination block). This matches what the existing

        handler returns and what the frontend reads today.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/WebsiteOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: WebsiteListOut
      type: object
    WebsiteOut:
      additionalProperties: false
      description: 'Response body for single-website GET / POST / PUT / PATCH.


        Mirrors ``_serialize_website()`` byte-for-byte. ``id`` is the

        stringified Mongo ``_id``; ``last_scraped`` and ``last_tested`` may be

        null. ``scraping_config`` is the nested dict produced by

        ``ScrapingConfig.to_dict()``.


        Timestamps are emitted as ISO 8601 strings (Pydantic default), which

        matches the legacy handler''s behaviour for this resource.'
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        display_name:
          title: Display Name
          type: string
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        last_scraped:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Scraped
        last_tested:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Tested
        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Name
        page_count:
          title: Page Count
          type: integer
        project_id:
          title: Project Id
          type: string
        scraping_config:
          $ref: '#/components/schemas/ScrapingConfigModel'
        url:
          title: Url
          type: string
      required:
      - project_id
      - url
      - display_name
      - page_count
      - scraping_config
      title: WebsiteOut
      type: object
    WebsitePatch:
      additionalProperties: false
      description: 'Request body for ``PATCH /api/v1/websites/<id>``.


        Every field is optional; only fields present in the body are applied.

        ``url`` validation runs only when ``url`` is provided.'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Url
      title: WebsitePatch
      type: object
    WebsitePut:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/websites/<id>``.


        PUT is a full replace of editable fields. Server-managed fields

        (``project_id``, ``created_at``, ``last_scraped``, ``last_tested``,

        ``page_count``, ``members``, ``discovery_history``) are preserved

        from the existing record and cannot be set via this endpoint.'
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        scraping_config:
          anyOf:
          - $ref: '#/components/schemas/ScrapingConfigModel'
          - type: 'null'
          default: null
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: WebsitePut
      type: object
    _PaginationOldShape:
      additionalProperties: false
      description: 'Pagination block for ``GET /projects`` -- legacy shape.


        Differs from ``PaginationMeta`` in ``common.py``: keys are

        ``page``/``limit``/``total`` (no ``per_page``, no ``total_pages``).'
      properties:
        limit:
          title: Limit
          type: integer
        page:
          title: Page
          type: integer
        total:
          title: Total
          type: integer
      required:
      - page
      - limit
      - total
      title: _PaginationOldShape
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: Token
      description: 'API token issued via /auth/tokens. Prefix: a11y_'
      scheme: bearer
      type: http
    sessionAuth:
      description: Flask-Login session cookie.
      in: cookie
      name: session
      type: apiKey
info:
  description: Documented surface for /api/v1/*.
  title: Auto A11y REST API
  version: 1.0.0
openapi: 3.1.0
paths:
  /discovered-pages/{page_id}:
    delete:
      description: Deletes the discovered page. Returns ``204 No Content`` with an
        empty body.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: &id001
          type: string
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Delete a discovered page
      tags:
      - DiscoveredPages
    get:
      description: Returns the discovered page resource.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredPageOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Get a discovered page by ID
      tags:
      - DiscoveredPages
    patch:
      description: Partial update -- only fields present in the request body are applied.
        ``updated_at`` is bumped on every successful PATCH. Returns the full updated
        resource.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveredPagePatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredPageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Partially update a discovered page
      tags:
      - DiscoveredPages
    put:
      description: Full replace of a discovered page's editable fields. Server-managed
        fields (``project_id``, ``source_*``, ``drupal_*``, ``created_at``, ``created_by``)
        are preserved from the existing record; clients cannot reassign a discovered
        page to a different project, change its source, or rewrite Drupal-sync state
        via this endpoint.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveredPagePut'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredPageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Replace a discovered page
      tags:
      - DiscoveredPages
  /pages/{page_id}:
    delete:
      description: Deletes the page and cascades to its test results. Returns ``204
        No Content`` with an empty body.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Delete a page
      tags:
      - Pages
    get:
      description: Returns the page resource (``PageOut``).
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Get a page by ID
      tags:
      - Pages
    patch:
      description: Partial update -- only fields present in the request body are applied.
        Returns the full updated ``PageOut``.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagePatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Partially update a page
      tags:
      - Pages
    put:
      description: Full replace of a page's editable fields. Server-managed fields
        (status, counts, dates, screenshot, drupal sync, discovery metadata) are preserved.
        ``website_id`` and ``url`` are locked -- the (website_id, url) pair is the
        page's identity. A PUT that changes ``url`` is rejected with 400.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagePut'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Replace a page
      tags:
      - Pages
  /pages/{page_id}/matrix:
    get:
      description: Returns the test-state matrix for a page. A page has at most one
        matrix; if none has been saved yet, returns a default in-memory matrix derived
        from the page's currently-enabled multi-state scripts with sequential combinations.
        ``id`` is ``null`` in that case so clients can detect a not-yet-persisted
        matrix.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatrixOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Get the test-state matrix for a page
      tags:
      - Pages
    put:
      description: Full replace of the page's test-state matrix. The ``scripts`` array
        on the persisted matrix is always rebuilt from the page's currently-enabled
        multi-state scripts at save time -- clients don't submit it. ``combinations``
        is required and each value must be ``"before"``, ``"after"``, or ``"none"``.
        ``script_order`` is optional and only repositions scripts already present
        on the page. The verb is PUT because the matrix is an idempotent 1:1 sub-resource
        of the page -- there is no PATCH or DELETE; clearing it means PUTing an empty
        ``combinations`` array.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageMatrixIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatrixOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Replace the test-state matrix for a page
      tags:
      - Pages
  /pages/{page_id}/violations:
    get:
      description: Returns the latest test result's issue buckets for a page (``violations``,
        ``warnings``, ``info``, ``discovery``, ``ai_findings``) so a UI can render
        a violations table without paging through the full result history. When the
        page has never been tested, the buckets are empty and ``test_result_id`` /
        ``tested_at`` are ``null``.
      parameters:
      - in: path
        name: page_id
        required: true
        schema: *id001
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageViolationsOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: Get the latest violations for a page
      tags:
      - Pages
  /projects:
    get:
      description: Returns the projects visible to the caller (member-of-project filtering
        for non-superadmins). Pagination uses page/limit; ``total`` reflects the unfiltered
        project count.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListOut'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
      security:
      - bearerAuth: []
      - sessionAuth: []
      summary: List projects
      tags:
      - Projects
    post:
      description: Creates a new project. The caller is auto-added as a project admin
        if authenticated. Returns ``{id, message}`` -- not the full project resource
        (wire-compat with the legacy handler).
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
