        test-user credential for sites that require auth.


        Dedup behaviour: both paths converge on ``create_or_find_pdf_document``, which
        dedupes by ``(website_id, sha256)``. A dedup hit returns the *existing* document
        with **status 200**; a new document persists and returns **201** with a ``Location``
        header pointing at ``/api/v1/pdf-documents/<id>``.'
