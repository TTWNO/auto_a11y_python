      - all_pass_count
      - partial_pass_count
      - all_fail_count
      title: FixtureTestStatusOut
      type: object
    ForgotPasswordIn:
      additionalProperties: false
      description: 'Request body for ``POST /auth/forgot-password``.


        ``email`` is ``Optional[str]`` because the handler ALWAYS

        returns 202 — even on missing/unknown/inactive email — to defend

        against email-enumeration attacks. Tightening the schema here

        would let a caller distinguish "missing field" from "unknown

        email" via the 400-vs-202 status difference.'
      properties:
        email:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Email
      title: ForgotPasswordIn
      type: object
    GenericSectionPatchIn:
      additionalProperties: true
      description: 'Request body for ``PATCH /admin/settings/<section_id>``.


        The set of valid keys varies per section (each ``CONFIG_SECTIONS``

        entry has its own ``ConfigField`` schema) so we use a

        :class:`RootModel` wrapping ``dict[str, object]`` rather than a

        typed model. The handler does the per-section validation against

        the live registry: unknown keys produce a 400 listing them,

        typed coercion happens per :class:`ConfigField`, and password

        fields with a blank string preserve the existing value.


        The OpenAPI surface for this endpoint is therefore a free-form

        object; consumers are expected to consult the corresponding

        ``GET /admin/settings`` section payload for the current per-field

        schema before patching.'
      title: GenericSectionPatchIn
      type: object
    GhostscriptHealthOut:
      additionalProperties: false
      description: 'Ghostscript-detection sub-block of :class:`HealthPdfOut`.


        Mirrors the dataclass ``GhostscriptHealth`` from

