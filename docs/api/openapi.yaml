        title:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Title
        url:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Url
      title: DiscoveredPagePatch
      type: object
    DiscoveredPagePut:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/discovered-pages/<id>``.


        Full replace of editable fields. Server-managed fields (project_id,

        source_*, drupal_*, created_at, created_by) are preserved; clients

        cannot reassign a discovered page to a different project, change

        its source, or rewrite Drupal-sync state via this endpoint.'
      properties:
        audited:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Audited
        document_links:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Document Links
        include_in_report:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include In Report
        interested_because:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Interested Because
        manual_audit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Manual Audit
        page_elements:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
