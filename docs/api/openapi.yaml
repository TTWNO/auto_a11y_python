components:
  schemas:
    ActiveTestRunOut:
      additionalProperties: false
      description: 'One row in the active-test-runs listing.


        Mirrors the legacy ``/testing/api/active-tests`` shape. ``progress``

        is a percentage-ish integer the worker emits, not a nested dict (in

        contrast to the JobManager top-level ``progress`` field).'
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        current_page:
          default: ''
          title: Current Page
          type: string
        job_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Job Id
        pages_completed:
          default: 0
          title: Pages Completed
          type: integer
        pages_total:
          default: 0
          title: Pages Total
          type: integer
        progress:
          default: 0
          title: Progress
          type: integer
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Started At
        status:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Status
        violations_found:
          default: 0
          title: Violations Found
          type: integer
        website_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Website Id
        website_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Website Name
      title: ActiveTestRunOut
      type: object
    ActiveTestRunsOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/test-runs?status=active``.


        Bare ``{items, count}`` envelope — no cursor pagination because the

        active set is bounded by the worker pool size (single-digit rows in

        every realistic deployment).'
      properties:
        count:
          title: Count
          type: integer
        items:
          items:
            $ref: '#/components/schemas/ActiveTestRunOut'
          title: Items
          type: array
      required:
      - items
      - count
      title: ActiveTestRunsOut
      type: object
    AdminSettingsOut:
      additionalProperties: false
      description: 'Response body for ``GET /admin/settings``.


        Top-level envelope combining the special-cased drupal section

        with the list of generic CONFIG_SECTIONS sections. The list order

        matches the registry order in ``auto_a11y.core.runtime_config``

        so the admin UI can render the sections in a stable, predictable

        sequence.'
      properties:
        drupal:
          $ref: '#/components/schemas/DrupalSettingsOut'
        sections:
          items:
            $ref: '#/components/schemas/SettingsSectionOut'
          title: Sections
          type: array
      required:
      - drupal
      - sections
      title: AdminSettingsOut
      type: object
    ApiTokenOut:
      additionalProperties: false
      description: 'JSON-safe projection of an :class:`ApiToken`.


        Mirrors the legacy ``_serialize_token`` helper byte-for-byte.

        The raw token value is NEVER surfaced here — it appears once on

        the ``token`` field of the login envelope and is not persisted

        in plaintext. This model is the token''s metadata only.'
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Description
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Expires At
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        last_used_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Used At
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      title: ApiTokenOut
      type: object
    AppUserCreateIn:
      additionalProperties: false
      description: 'Request body for ``POST /users`` (admin-create).


        Distinct from :class:`RegisterIn` because the admin path can

        set ``role`` and ``is_superadmin`` at create time. ``role``

        defaults to ``client`` server-side when absent; ``is_superadmin``

        defaults to false. Both ``email`` and ``password`` are typed

        loosely (``Optional[str]``) to preserve the legacy field-path

        400 envelope.


        Note: this endpoint does NOT issue a Bearer token (unlike

        ``/auth/register``) because the admin doesn''t need to become the

        newly-created user.'
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Display Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Email
        is_superadmin:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Is Superadmin
        password:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Password
        role:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Role
      title: AppUserCreateIn
      type: object
    AppUserListOut:
      additionalProperties: false
      description: 'Response body for ``GET /users``.


        Non-paginated ``{users: [...]}`` envelope. The production user

        count is small (typically <100) so cursor pagination is overkill;

        if the user count ever grows past that, swap to the shared

        cursor-pagination shape.'
      properties:
        users:
          items:
            $ref: '#/components/schemas/AppUserOut'
          title: Users
          type: array
      required:
      - users
      title: AppUserListOut
      type: object
    AppUserOut:
      additionalProperties: false
      description: 'JSON-safe projection of an :class:`AppUser`.


        Mirrors the legacy ``_serialize_app_user`` helper byte-for-byte:

        ``id``, ``email``, ``display_name`` (nullable), ``role`` (enum

        string value), ``is_active``, ``is_superadmin``, plus three

        ISO-8601 timestamps (``created_at``, ``updated_at``,

        ``last_login`` — the last one nullable because never-logged-in

        users carry ``None``).


        Deliberately omits ``password_hash``, ``sso_provider``, and

        ``sso_id`` — those are internal-only and never surface on the

        wire.'
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Display Name
        email:
          title: Email
          type: string
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        is_active:
          title: Is Active
          type: boolean
        is_superadmin:
          title: Is Superadmin
          type: boolean
        last_login:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Login
        role:
          title: Role
          type: string
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Updated At
      required:
      - email
      - role
      - is_active
      - is_superadmin
      title: AppUserOut
      type: object
    AppUserPatch:
      additionalProperties: false
      description: 'Request body for ``PATCH /users/<id>`` (admin-patch).


        Adds ``role``, ``is_active``, ``is_superadmin`` over the

        self-service :class:`AuthMePatch` shape. Email is deliberately

        not editable through this endpoint — email is the natural key for

        SSO matching and changing it can orphan OAuth-linked sessions.


        ``is_superadmin`` is not gated against self-demotion at the API

        layer; the operator can lock themselves out and would need to

        recover via direct DB access.'
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Display Name
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Is Active
        is_superadmin:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Is Superadmin
        password:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Password
        role:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Role
      title: AppUserPatch
      type: object
    AuthMePatch:
      additionalProperties: false
      description: 'Request body for ``PATCH /auth/me``.


        Self-service profile edits — only ``display_name`` and

        ``password`` are patchable. ``email`` is the natural key for SSO

        matching and the role/superadmin flags are admin-only mutations

        (use ``PATCH /users/<id>`` for those). Both fields are

        ``Optional`` because PATCH semantics mean absent ⇒ no change.


        Password is typed loosely (``Optional[str]``) so the existing

        field-path 400 envelope continues to fire for invalid values.'
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Display Name
        password:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Password
      title: AuthMePatch
      type: object
    AvailableGroupOut:
      additionalProperties: false
      description: 'A group entry on the project-member list response.


        Narrow projection of :class:`GroupOut` carrying only the fields

        the add-member UI needs (id, name, ``is_system`` so the picker

        can flag protected defaults). The full group resource lives at

        ``/api/v1/groups/<id>``.'
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        is_system:
          title: Is System
          type: boolean
        name:
          title: Name
          type: string
      required:
      - name
      - is_system
      title: AvailableGroupOut
      type: object
    CurrentUserOut:
      additionalProperties: false
      description: 'Response body for ``GET /users/me``.


        Intentionally narrower than :class:`AppUserOut` — the legacy

        handler surfaced only ``user_id``, ``email``, ``display_name``,

        and ``is_superadmin``. SPAs that need the fuller surface

        (``role``, timestamps, ``is_active``) should call ``GET

        /auth/me`` instead.


        ``user_id`` is ``Optional[str]`` because the legacy projection

        coerced ``None`` IDs to ``"None"`` then back to ``None`` —

        preserving that nullability rather than coercing to ``""``.'
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Display Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Email
        is_superadmin:
          title: Is Superadmin
          type: boolean
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: User Id
      required:
      - is_superadmin
      title: CurrentUserOut
      type: object
    DiscoveredPageIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/projects/<id>/discovered-pages``.


        Mirrors the keys ``_build_discovered_page_from_body`` reads from

        the wire. ``title`` and ``url`` are required; the rest fall back

        to the dataclass defaults. ``document_links`` items are free-form

        objects (e.g. ``{"uri": ..., "title": ...}``) — modelled as

        ``dict[str, object]`` to match the legacy handler''s contract.'
      properties:
        audited:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Audited
        document_links:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Document Links
        include_in_report:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include In Report
        interested_because:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Interested Because
        manual_audit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Manual Audit
        page_elements:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Page Elements
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Screenshot Paths
        source_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Type
        title:
          minLength: 1
          title: Title
          type: string
        url:
          minLength: 1
          title: Url
          type: string
      required:
      - title
      - url
      title: DiscoveredPageIn
      type: object
    DiscoveredPageListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects/<id>/discovered-pages``.


        Cursor-paginated; same shape as the websites/pages lists.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/DiscoveredPageOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: DiscoveredPageListOut
      type: object
    DiscoveredPageOut:
      additionalProperties: false
      description: 'Response body for single-discovered-page GET / POST / PUT / PATCH.


        Mirrors ``_serialize_discovered_page()`` byte-for-byte. ``id`` is

        the stringified Mongo ``_id``; timestamps are ISO 8601 strings.

        Drupal-sync fields are exposed read-only (managed by the Drupal sync

        subsystem, not by REST clients).'
      properties:
        audited:
          title: Audited
          type: boolean
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created By
        document_links:
          items:
            additionalProperties: true
            type: object
          title: Document Links
          type: array
        drupal_error_message:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Drupal Error Message
        drupal_last_synced:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Drupal Last Synced
        drupal_sync_status:
          title: Drupal Sync Status
          type: string
        drupal_uuid:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Drupal Uuid
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        include_in_report:
          title: Include In Report
          type: boolean
        interested_because:
          items:
            type: string
          title: Interested Because
          type: array
        manual_audit:
          title: Manual Audit
          type: boolean
        page_elements:
          items:
            type: string
          title: Page Elements
          type: array
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        project_id:
          title: Project Id
          type: string
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          items:
            type: string
          title: Screenshot Paths
          type: array
        source_component_signature:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Component Signature
        source_page_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Page Id
        source_type:
          title: Source Type
          type: string
        source_upload_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Upload Id
        source_website_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Website Id
        title:
          title: Title
          type: string
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Updated At
        url:
          title: Url
          type: string
      required:
      - title
      - url
      - project_id
      - source_type
      - interested_because
      - page_elements
      - include_in_report
      - audited
      - manual_audit
      - screenshot_paths
      - document_links
      - drupal_sync_status
      title: DiscoveredPageOut
      type: object
    DiscoveredPagePatch:
      additionalProperties: false
      description: 'Request body for ``PATCH /api/v1/discovered-pages/<id>``.


        All fields optional; only present fields are applied. ``title`` and

        ``url`` must be non-empty if provided.'
      properties:
        audited:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Audited
        document_links:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Document Links
        include_in_report:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include In Report
        interested_because:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Interested Because
        manual_audit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Manual Audit
        page_elements:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Page Elements
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Screenshot Paths
        title:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Title
        url:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Url
      title: DiscoveredPagePatch
      type: object
    DiscoveredPagePut:
      description: 'Request body for ``PUT /api/v1/discovered-pages/<id>``.


        Full replace of editable fields. Server-managed fields (project_id,

        source_*, drupal_*, created_at, created_by) are preserved; clients

        cannot reassign a discovered page to a different project, change

        its source, or rewrite Drupal-sync state via this endpoint.'
      properties:
        audited:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Audited
        document_links:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Document Links
        include_in_report:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include In Report
        interested_because:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Interested Because
        manual_audit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Manual Audit
        page_elements:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Page Elements
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Screenshot Paths
        source_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Type
        title:
          minLength: 1
          title: Title
          type: string
        url:
          minLength: 1
          title: Url
          type: string
      required:
      - title
      - url
      title: DiscoveredPagePut
      type: object
    DiscoveryRunListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/websites/<id>/discoveries``.


        Cursor-paginated; same ``{items, next_cursor}`` shape as the other

        v1 list endpoints.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/DiscoveryRunOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: DiscoveryRunListOut
      type: object
    DiscoveryRunOut:
      additionalProperties: false
      description: 'Response body for read endpoints on a single DiscoveryRun.


        Mirrors :func:`_serialize_discovery_run` byte-for-byte. ``id`` is

        the stringified Mongo ``_id``; timestamps are ISO 8601 strings;

        ``status`` is the stringified :class:`DiscoveryStatus` enum value.

        ``failed_pages_details`` is kept as ``list[dict[str, object]]``

        because the failure-reason shape varies per crawler error class.'
      properties:
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Completed At
        documents_found:
          title: Documents Found
          type: integer
        duration_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Duration Seconds
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Error Message
        external_links_found:
          title: External Links Found
          type: integer
        failed_pages_details:
          items:
            additionalProperties: true
            type: object
          title: Failed Pages Details
          type: array
        follow_external:
          title: Follow External
          type: boolean
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        is_latest:
          title: Is Latest
          type: boolean
        job_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Job Id
        max_depth:
          title: Max Depth
          type: integer
        max_pages:
          title: Max Pages
          type: integer
        pages_added:
          title: Pages Added
          type: integer
        pages_discovered:
          title: Pages Discovered
          type: integer
        pages_failed:
          title: Pages Failed
          type: integer
        pages_removed:
          title: Pages Removed
          type: integer
        pages_unchanged:
          title: Pages Unchanged
          type: integer
        respect_robots:
          title: Respect Robots
          type: boolean
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Started At
        status:
          title: Status
          type: string
        triggered_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Triggered By
        website_id:
          title: Website Id
          type: string
      required:
      - website_id
      - status
      - max_pages
      - max_depth
      - follow_external
      - respect_robots
      - pages_discovered
      - pages_failed
      - documents_found
      - external_links_found
      - failed_pages_details
      - pages_added
      - pages_removed
      - pages_unchanged
      - is_latest
      title: DiscoveryRunOut
      type: object
    DocumentReferenceListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/websites/<id>/documents``.


        Cursor-paginated; same ``{items, next_cursor}`` shape as the other

        v1 list endpoints.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/DocumentReferenceOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: DocumentReferenceListOut
      type: object
    DocumentReferenceOut:
      additionalProperties: false
      description: 'Response body for a single document-reference row.


