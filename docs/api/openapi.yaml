  /scripts/{script_id}/test-runs:
    post:
      description: Runs the script against its target URL (page-scoped scripts use
        the linked page's URL; website-scoped scripts use the website's root URL).
        **Synchronous** -- the legacy ``POST /scripts/<id>/test`` blocks the request
        thread until the browser executes the script and clients rely on the inline
        result; this REST shape preserves that semantic even though the URL implies
        async by convention. The 200 status code (rather than the usual 202) signals
        "done synchronously". If the script raises during execution the same JSON
        envelope is returned with ``success=false`` and a populated ``error`` field,
        but with status 500 so monitoring tooling can flag the failure. ``TEST_RUN``-scoped
        scripts surface as 404; ``BROWSER_MODE`` set to ``disabled`` or ``remote``
        surfaces as 409. The request body is currently a no-op (the script's persisted
        ``steps`` are the authoritative input); accepting the body shape keeps the
        door open for per-run overrides.
