    FixtureTestCheckOut:
      additionalProperties: false
      description: "Response body for ``GET /fixture-tests/check/<error_code>``.\n\
        \nPer-code fixture probe. Mirrors the legacy handler envelope\nbyte-for-byte:\n\
        \n- ``success`` — always ``true`` on the success path.\n- ``error_code`` —\
        \ echo of the path parameter.\n- ``available`` — ``True`` when the code is\
        \ enabled in\n  production (all fixtures passing OR ``debug_mode`` is on).\n\
        - ``passed_fixture`` — pure fixture signal, ignoring debug\n  mode. ``False``\
        \ when fixtures partially or fully failed.\n- ``debug_override`` — ``True``\
        \ when ``debug_mode`` is the\n  reason ``available`` is true (i.e. fixtures\
        \ didn't pass but\n  we're forcing the test on for debugging).\n- ``fixture_path``\
        \ — the validator's back-compat summary field\n  (e.g. ``\"3 fixtures\"``).\
        \ Empty string when no fixtures were\n  ever run for this code.\n- ``tested_at``\
        \ — ISO 8601 timestamp of the most recent\n  fixture run for this code, or\
        \ ``null`` when no run is\n  recorded."
      properties:
        available:
          title: Available
          type: boolean
        debug_override:
          title: Debug Override
          type: boolean
        error_code:
          title: Error Code
          type: string
        fixture_path:
          title: Fixture Path
          type: string
        passed_fixture:
          title: Passed Fixture
          type: boolean
        success:
          title: Success
          type: boolean
        tested_at:
          anyOf:
