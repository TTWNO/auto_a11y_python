        resets each page's cached test state (violation / warning / info / discovery
        / pass counts, ``last_tested``, ``test_duration_ms``) so they show as untested
        again. Pages in TESTED / TESTING / ERROR move back to DISCOVERED; PDFs in
        AUDITED / AUDITING / AUDIT_FAILED move back to PENDING. The website itself,
        its pages, screenshots, discovery runs, and document references are preserved.
