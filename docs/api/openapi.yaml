    post:
      description: Transitions any job in RUNNING / PENDING / CANCELLING for more
        than 24 hours to a terminal state via ``JobManager.cleanup_stale_jobs``. Also
        resets pages stuck in QUEUED or TESTING with a ``last_tested`` (or ``discovered_at``
        fallback) older than 24 hours back to DISCOVERED. Returns the per-bucket counts
        and a human-readable message.
      parameters: []
      responses:
        '200':
          content:
            application/json:
