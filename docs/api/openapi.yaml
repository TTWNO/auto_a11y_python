          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: GroupListOut
      type: object
    GroupOut:
      additionalProperties: false
      description: "Response shape for a single permission group.\n\nMirrors :func:`_serialize_permission_group`\
        \ byte-for-byte. Used by:\n\n- ``GET /groups/<group_id>``\n- ``POST /groups``\
        \ (create response)\n- ``PUT /groups/<group_id>`` (replace response)\n- ``PATCH\
        \ /groups/<group_id>`` (patch response)\n- ``GET /groups`` (inside ``items``)\n\
        \nField details:\n\n- ``id`` — stringified Mongo ``_id``; ``None`` only for\
        \ transient\n  unsaved groups that never appear over the wire.\n- ``permissions``\
        \ — open ``dict[str, str]`` rather than a closed\n  enum-of-enums because\
        \ the resource-noun list is expected to grow.\n- ``is_system`` — ``True``\
        \ for the seeded default groups (Admin,\n  Auditor, Client) which are protected\
        \ from deletion.\n- ``created_at`` / ``updated_at`` — ISO 8601 datetime strings."
      properties:
        created_at:
          anyOf:
