components:
  schemas:
    DiscoveredPageIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/projects/<id>/discovered-pages``.


        Mirrors the keys ``_build_discovered_page_from_body`` reads from

        the wire. ``title`` and ``url`` are required; the rest fall back

        to the dataclass defaults. ``document_links`` items are free-form

        objects (e.g. ``{"uri": ..., "title": ...}``) — modelled as

        ``dict[str, object]`` to match the legacy handler''s contract.'
      properties:
        audited:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Audited
        document_links:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Document Links
        include_in_report:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include In Report
        interested_because:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Interested Because
        manual_audit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Manual Audit
        page_elements:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Page Elements
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Screenshot Paths
        source_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Type
        title:
          minLength: 1
          title: Title
          type: string
        url:
          minLength: 1
          title: Url
          type: string
      required:
      - title
      - url
      title: DiscoveredPageIn
      type: object
    DiscoveredPageListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects/<id>/discovered-pages``.


        Cursor-paginated; same shape as the websites/pages lists.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/DiscoveredPageOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: DiscoveredPageListOut
      type: object
    DiscoveredPageOut:
      additionalProperties: false
      description: 'Response body for single-discovered-page GET / POST / PUT / PATCH.


        Mirrors ``_serialize_discovered_page()`` byte-for-byte. ``id`` is

        the stringified Mongo ``_id``; timestamps are ISO 8601 strings.

        Drupal-sync fields are exposed read-only (managed by the Drupal sync

        subsystem, not by REST clients).'
      properties:
        audited:
          title: Audited
          type: boolean
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created By
        document_links:
          items:
            additionalProperties: true
            type: object
          title: Document Links
          type: array
        drupal_error_message:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Drupal Error Message
        drupal_last_synced:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Drupal Last Synced
        drupal_sync_status:
          title: Drupal Sync Status
          type: string
        drupal_uuid:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Drupal Uuid
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        include_in_report:
          title: Include In Report
          type: boolean
        interested_because:
          items:
            type: string
          title: Interested Because
          type: array
        manual_audit:
          title: Manual Audit
          type: boolean
        page_elements:
          items:
            type: string
          title: Page Elements
          type: array
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        project_id:
          title: Project Id
          type: string
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          items:
            type: string
          title: Screenshot Paths
          type: array
        source_component_signature:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Component Signature
        source_page_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Page Id
        source_type:
          title: Source Type
          type: string
        source_upload_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Upload Id
        source_website_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Website Id
        title:
          title: Title
          type: string
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Updated At
        url:
          title: Url
          type: string
      required:
      - title
      - url
      - project_id
      - source_type
      - interested_because
      - page_elements
      - include_in_report
      - audited
      - manual_audit
      - screenshot_paths
      - document_links
      - drupal_sync_status
      title: DiscoveredPageOut
      type: object
    DiscoveredPagePatch:
      additionalProperties: false
      description: 'Request body for ``PATCH /api/v1/discovered-pages/<id>``.


        All fields optional; only present fields are applied. ``title`` and

        ``url`` must be non-empty if provided.'
      properties:
        audited:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Audited
        document_links:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Document Links
        include_in_report:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include In Report
        interested_because:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Interested Because
        manual_audit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Manual Audit
        page_elements:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Page Elements
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Screenshot Paths
        title:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Title
        url:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Url
      title: DiscoveredPagePatch
      type: object
    DiscoveredPagePut:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/discovered-pages/<id>``.


        Full replace of editable fields. Server-managed fields (project_id,

        source_*, drupal_*, created_at, created_by) are preserved; clients

        cannot reassign a discovered page to a different project, change

        its source, or rewrite Drupal-sync state via this endpoint.'
      properties:
        audited:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Audited
        document_links:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Document Links
        include_in_report:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include In Report
        interested_because:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Interested Because
        manual_audit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Manual Audit
        page_elements:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Page Elements
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Screenshot Paths
        source_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Type
        title:
          minLength: 1
          title: Title
          type: string
        url:
          minLength: 1
          title: Url
          type: string
      required:
      - title
      - url
      title: DiscoveredPagePut
      type: object
    Empty:
      additionalProperties: false
      description: Empty body — for 204 responses or endpoints that return ``{}``.
      properties: {}
      title: Empty
      type: object
    JobRestartOut:
      additionalProperties: false
      description: 'Response body (202) for ``POST /jobs/<id>/restart``.


        Same shape as :class:`ReportCreatedOut` plus ``old_job_id`` so the

        caller can tie the new run to the original. The new ``job_id`` is

        the freshly-queued worker''s id — the old job is left in place (its

        cancellation flag is set so its worker exits cleanly).'
      properties:
        display_name:
          title: Display Name
          type: string
        job_id:
          title: Job Id
          type: string
        old_job_id:
          title: Old Job Id
          type: string
        scope:
          title: Scope
          type: string
        status:
          const: queued
          title: Status
          type: string
      required:
      - old_job_id
      - job_id
      - scope
      - display_name
      - status
      title: JobRestartOut
      type: object
    MessageOut:
      additionalProperties: false
      description: Generic single-message response (used by the PUT handler).
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: MessageOut
      type: object
    PageIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/websites/<id>/pages``.


        ``url`` is required; ``title``, ``priority``, and ``setup_script_id``

        are optional. URL is validated for the ``http(s)://`` prefix in the

        handler (matching the legacy ``_validate_url`` rule).'
      properties:
        priority:
          anyOf:
          - enum:
            - high
            - normal
            - low
            type: string
          - type: 'null'
          default: null
          title: Priority
        setup_script_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Setup Script Id
        title:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          default: null
          title: Title
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: PageIn
      type: object
    PageListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/websites/<id>/pages``.


        Cursor-paginated; same shape as the websites list.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/PageOut'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
      required:
      - items
      title: PageListOut
      type: object
    PageMatrixIn:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/pages/<id>/matrix``.


        ``combinations`` is required: a list of ``{script_id: state}`` dicts

        where each value must be ``"before"``, ``"after"``, or ``"none"``.

        The handler additionally validates the inner state strings (since

        Pydantic cannot constrain values inside a free-form ``dict[str, str]``

        field at schema generation time without losing the arbitrary

        script-id key shape).


        ``script_order`` is optional and only repositions scripts already

        present on the page; entries for script IDs the page does not

        currently have are silently ignored by the handler.'
      properties:
        combinations:
          items:
            additionalProperties:
              type: string
            type: object
          title: Combinations
          type: array
        script_order:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScriptOrderEntry'
            type: array
          - type: 'null'
          default: null
          title: Script Order
      required:
      - combinations
      title: PageMatrixIn
      type: object
    PageMatrixOut:
      additionalProperties: false
      description: 'Response body for matrix GET / PUT.


        Mirrors ``_serialize_test_state_matrix()``. ``id`` is null when the

        matrix has not been persisted yet (the GET handler returns a

        derived in-memory default the first time the endpoint is hit).'
      properties:
        combinations:
          items:
            additionalProperties:
              type: string
            type: object
          title: Combinations
          type: array
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created By
        created_date:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created Date
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        last_modified:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Modified
        page_id:
          title: Page Id
          type: string
        scripts:
          items:
            $ref: '#/components/schemas/ScriptStateDefinitionOut'
          title: Scripts
          type: array
        website_id:
          title: Website Id
          type: string
      required:
      - page_id
      - website_id
      - scripts
      - combinations
      title: PageMatrixOut
      type: object
    PageOut:
      additionalProperties: false
      description: 'Response body for single-page GET / POST / PUT / PATCH.


        Mirrors ``_serialize_page()`` byte-for-byte. ``id`` is the stringified

        Mongo ``_id``; timestamps are ISO 8601. Drupal-sync fields are

        intentionally excluded from this surface (the legacy serializer

        omitted them too).'
      properties:
        depth:
          title: Depth
          type: integer
        discovered_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Discovered At
        discovered_from:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Discovered From
        discovery_count:
          title: Discovery Count
          type: integer
        discovery_run_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Discovery Run Id
        error_reason:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Error Reason
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Id
        info_count:
          title: Info Count
          type: integer
        is_in_latest_discovery:
          title: Is In Latest Discovery
          type: boolean
        last_tested:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Tested
        linked_pdf_document_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Linked Pdf Document Id
        pass_count:
          title: Pass Count
          type: integer
        priority:
          title: Priority
          type: string
        screenshot_path:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Screenshot Path
        setup_script_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Setup Script Id
        status:
          title: Status
          type: string
        test_duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Test Duration Ms
        title:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Title
        url:
          title: Url
          type: string
        violation_count:
          title: Violation Count
          type: integer
        warning_count:
          title: Warning Count
          type: integer
        website_id:
          title: Website Id
          type: string
      required:
      - website_id
      - url
      - status
      - priority
      - depth
      - violation_count
      - warning_count
      - info_count
      - discovery_count
      - pass_count
      - is_in_latest_discovery
      title: PageOut
      type: object
    PagePatch:
      additionalProperties: false
      description: 'Request body for ``PATCH /api/v1/pages/<id>``.


        Only fields present in the body are applied. ``url`` and

        ``website_id`` are not patchable (the page identity is the pair).'
      properties:
        priority:
          anyOf:
          - enum:
            - high
            - normal
            - low
            type: string
          - type: 'null'
          default: null
          title: Priority
        setup_script_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Setup Script Id
        title:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          default: null
          title: Title
      title: PagePatch
      type: object
    PagePut:
      additionalProperties: false
      description: 'Request body for ``PUT /api/v1/pages/<id>``.


        Full replace of editable fields. Server-managed fields (status,

        counts, dates, screenshot, drupal sync, discovery metadata) are

        preserved. ``website_id`` and ``url`` are also locked — the

        (website_id, url) pair is the page identity. A PUT that changes

        ``url`` is rejected with 400.'
      properties:
        priority:
          anyOf:
          - enum:
            - high
            - normal
            - low
            type: string
          - type: 'null'
          default: null
          title: Priority
        setup_script_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Setup Script Id
        title:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          default: null
          title: Title
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: PagePut
      type: object
    PageReportIn:
      additionalProperties: false
      description: 'Request body for queueing a single-page report.


        Both fields are optional. ``format`` defaults to ``xlsx`` on the

        server; ``include_ai`` defaults to ``true``. Unknown keys are

        rejected by ``extra=''forbid''`` to keep the surface tight.'
      properties:
        format:
          anyOf:
          - enum:
            - xlsx
            - html
            - csv
            - pdf
            - excel
            type: string
          - type: 'null'
          default: null
          title: Format
        include_ai:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include Ai
      title: PageReportIn
      type: object
    PageTestRunCancelOut:
      additionalProperties: false
      description: 'Response body (202) for cancelling a page''s in-flight test run.


        Cancellation is asynchronous; the worker polls the task''s

        cancellation flag at its next checkpoint. The page status flips

        to ``DISCOVERED`` (never tested) or ``TESTED`` (has prior results)

        immediately so the UI doesn''t lock up on a phantom run.


        ``task_id`` may be ``null`` when the page was QUEUED but the worker

        had not yet spawned the task (a recovered-state path).'
      properties:
        cancellation_requested:
          title: Cancellation Requested
          type: boolean
        page_id:
          title: Page Id
          type: string
        status:
          title: Status
          type: string
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Task Id
      required:
      - page_id
      - cancellation_requested
      - status
      title: PageTestRunCancelOut
      type: object
    PageTestRunIn:
      additionalProperties: false
      description: 'Request body for queueing a single-page test run.


        Both ``POST /api/v1/pages/<id>/test`` (legacy alias) and the

        canonical ``POST /api/v1/pages/<id>/test-runs`` share this body.


        All fields are optional; ``enable_multi_state`` defaults to true on

        the server (mirroring :func:`start_page_test_run`).'
      properties:
        enable_multi_state:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Enable Multi State
        website_user_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Website User Id
      title: PageTestRunIn
      type: object
    PageTestRunLatestOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/pages/<id>/test-runs/latest``.


        Surfaces *just* the run-level state — separate from the historical

        test-result list — so UIs can drive a "test in flight" indicator

        without paginating the whole history.


        ``status`` is a free-form string (the :class:`PageStatus` enum

        values: ``discovered``, ``queued``, ``testing``, ``tested``,

        ``error``, ``skipped``, ...). We don''t use a ``Literal`` here

        because new enum members would silently fail validation; the legacy

        handler is also string-typed.


        ``active_task_id`` is the task-runner id (pattern

        ``test_page_<page_id>_<timestamp>``) when the worker is still

        running, otherwise ``null``.'
      properties:
        active_task_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Active Task Id
        last_test_result_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Test Result Id
        last_tested:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Tested
        page_id:
          title: Page Id
          type: string
        status:
          title: Status
          type: string
      required:
      - page_id
      - status
      title: PageTestRunLatestOut
      type: object
    PageTestRunStartedOut:
      additionalProperties: false
      description: 'Response body (202) for queueing a single-page test run.


        Mirrors the legacy handler''s ``jsonify`` payload byte-for-byte.

        ``status`` is always ``"queued"``; ``message`` is the human-readable

        fallback the legacy clients display.'
      properties:
        job_id:
          title: Job Id
          type: string
        message:
          title: Message
          type: string
        multi_state:
          title: Multi State
          type: boolean
        page_id:
          title: Page Id
          type: string
        status:
          const: queued
          title: Status
          type: string
      required:
      - job_id
      - page_id
      - multi_state
      - status
      - message
      title: PageTestRunStartedOut
      type: object
    PageTestSessionOut:
      additionalProperties: false
      description: One session entry inside the sessions listing.
      properties:
        session_id:
          title: Session Id
          type: string
        state_count:
          title: State Count
          type: integer
        states:
          items:
            $ref: '#/components/schemas/PageTestSessionStateOut'
          title: States
          type: array
        test_date:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Test Date
        total_violations:
          title: Total Violations
          type: integer
        total_warnings:
          title: Total Warnings
          type: integer
      required:
      - session_id
      - states
      - total_violations
      - total_warnings
      - state_count
      title: PageTestSessionOut
      type: object
    PageTestSessionStateOut:
      additionalProperties: false
      description: 'A single state''s summary inside a session.


