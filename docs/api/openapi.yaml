      - status
      title: Problem
      type: object
    ProjectCreatedOut:
      additionalProperties: false
      description: 'Response body for ``POST /api/v1/projects`` (current wire shape).


        The legacy handler returns ``{"id": <new_id>, "message": "..."}`` --

        NOT the full project resource. Preserved here byte-for-byte.'
      properties:
        id:
          title: Id
          type: string
        message:
          title: Message
          type: string
      required:
