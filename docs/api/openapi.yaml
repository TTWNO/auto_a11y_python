components:
  schemas:
    DiscoveredPageIn:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/projects/<id>/discovered-pages``.


        Mirrors the keys ``_build_discovered_page_from_body`` reads from

        the wire. ``title`` and ``url`` are required; the rest fall back

        to the dataclass defaults. ``document_links`` items are free-form

        objects (e.g. ``{"uri": ..., "title": ...}``) — modelled as

        ``dict[str, object]`` to match the legacy handler''s contract.'
      properties:
        audited:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Audited
        document_links:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Document Links
        include_in_report:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Include In Report
        interested_because:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Interested Because
        manual_audit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Manual Audit
        page_elements:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Page Elements
        private_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Private Notes
        public_notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Public Notes
        screenshot_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Screenshot Paths
        source_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Type
        title:
          minLength: 1
          title: Title
          type: string
        url:
          minLength: 1
          title: Url
          type: string
      required:
      - title
      - url
      title: DiscoveredPageIn
      type: object
    DiscoveredPageListOut:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/projects/<id>/discovered-pages``.


        Cursor-paginated; same shape as the websites/pages lists.'
