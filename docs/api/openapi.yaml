  /reports/{report_id}/file:
    get:
      description: 'Streams the completed report bytes with ``Content-Disposition:
        attachment``. The response body is the raw report file (xlsx, html, csv, pdf,
        ...) and is not modelled as JSON -- ``@document`` passes the Flask Response
        through unchanged. Returns 404 for any of: job missing, job not a report-generation
        job, job not yet COMPLETED, result/filename missing, or file removed from
        disk after generation. Authorization mirrors the report''s scope (project/website/page
        -> ADMIN/AUDITOR/CLIENT on that scope; cross-project rollups -> superadmin).'
