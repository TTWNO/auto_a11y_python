      - description
      - permissions
      - is_system
      title: GroupOut
      type: object
    GroupPatch:
      additionalProperties: false
      description: 'PATCH body for partially updating a permission group.


        Same shape as :class:`GroupIn` — every field optional. ``is_system``

        is intentionally absent: that flag protects the seeded default

        groups from deletion and clients are never permitted to flip it on

        or off.'
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Description
        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Name
        permissions:
          anyOf:
          - additionalProperties:
