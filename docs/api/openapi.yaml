  /auth/forgot-password:
    post:
      description: Always returns 202 — even if the email is missing, unknown, or
        matches an inactive user — so an attacker can't probe which addresses are
        registered. When the email matches an active user, the handler generates a
        signed reset token and dispatches the standard ``auth.py`` reset email. Email
        delivery failures are swallowed (logged but not surfaced) so the response
        time doesn't leak which branch fired.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordIn'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: Accepted
      security: []
      summary: Request a password-reset email
      tags:
      - Auth
  /auth/login:
    post:
      description: Exchanges email and password for a freshly-minted API Bearer token.
        Returns the raw token ONCE in the ``token`` field — the database stores only
        its hash, so the caller MUST persist it client-side. On any failure (unknown
        email, wrong password, deactivated user) returns 401 with an opaque ``invalid
        credentials`` message so the caller can't distinguish which case fired (defends
        against email enumeration). On success the handler records the login (bumps
        ``login_count``, clears ``failed_login_count``) and mints the token with the
        supplied ``description`` label so the user can later identify the session
        on the tokens page.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
      security: []
      summary: Log in with email + password
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the Bearer token used to authorize the call. Idempotent
        — a request with no token or an already-revoked token still returns 204. The
        motivation is a "log out" button on the client that should always succeed
        even if the session expired between the user clicking and the server seeing
        the request. Session-cookie callers still need to hit the legacy ``/auth/logout``
        HTML route to clear the cookie — this endpoint only touches the Bearer side.
      parameters: []
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: No Content
      security: []
      summary: Revoke the current Bearer token
      tags:
      - Auth
