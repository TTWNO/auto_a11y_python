        or runs: violations newly introduced in ``result_2``, violations that disappeared
        from ``result_1``, and violations present in both. The ``comparison`` payload
        is deeply nested and emitted as a free-form object (the legacy handler builds
        it inline; modelling each leaf would inflate this surface without changing
        the wire — §5.x downstream work will revisit).'
