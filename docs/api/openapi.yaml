      additionalProperties: false
      description: "Request body for ``PATCH /admin/settings/drupal``.\n\nAll fields\
        \ are ``Optional`` so PATCH semantics hold — absent ⇒\nno change for that\
        \ field. The handler uses\n:pyattr:`pydantic.BaseModel.model_fields_set` to\
        \ distinguish\n\"field omitted\" from \"field set to null\":\n\n- ``base_url``,\
        \ ``username`` — must be non-empty http(s) string\n  when present; an explicit\
        \ ``null`` raises 400.\n- ``password`` — omitted preserves the existing stored\
        \ value\n  (so admins don't re-enter the secret on every edit). An\n  explicit\
        \ ``null`` also preserves; only a real string overwrites.\n  If no existing\
        \ password is stored AND the field is omitted, a\n  400 is raised (the section\
        \ can't be partially configured).\n- ``enabled`` — boolean; absent ⇒ fall\
        \ back to existing or\n  ``true``; explicit ``null`` ⇒ 400. Typed as\n  :class:`pydantic.StrictBool`\
        \ so JSON string values like\n  ``\"true\"`` are rejected at validation time\
        \ rather than coerced\n  (matching the legacy ``isinstance(bool)`` gate).\n\
        \nThe string fields are typed loosely (``Optional[str]``) rather\nthan strictly\
        \ because the legacy handler emits a field-path 400\nvia the :class:`_FieldError`\
        \ envelope on bad types; Pydantic's\nown ValidationError envelope would surface\
        \ a different error\nshape. The schema documents the wire shape; the handler\
        \ enforces\nthe per-field validation."
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Base Url
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Enabled
        password:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Password
        username:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Username
      title: DrupalSettingsPatchIn
      type: object
