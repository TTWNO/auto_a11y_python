# =========================================================================
# Strict type-checking config.
# Spec: docs/superpowers/specs/2026-04-16-strict-type-checking-design.md
# Plan: docs/superpowers/plans/2026-04-16-strict-type-checking.md
# =========================================================================

# Project-namespaced flag: lets the .githooks/pre-commit script and the
# CI workflow skip `ty` in the narrow case of an upstream ty bug that no
# refactor can satisfy. MUST NOT be used for any other purpose. Flip
# back on the next ty release that fixes the upstream bug.
[tool.auto_a11y_typecheck]
ty_enabled = true

[tool.mypy]
python_version = "3.11"
files = [
    "auto_a11y",
    "tests",
    "stubs",
    "config.py",
    "run.py",
    "wsgi.py",
    "test_fixtures.py",
    # PDF audit engine port — Phase 7. Other scripts/ entries remain
    # excluded (no per-tool exclude knob in mypy; we just don't list them).
    "scripts/port_pdfmax_remediation_guide.py",
]
mypy_path = "stubs"
namespace_packages = true
explicit_package_bases = true

# Strict mode and everything above it
strict = true
disallow_any_unimported = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
implicit_reexport = false

# --- Per-module relaxations for large HTML/report generators ---
# These files are 2000-4000 lines of HTML string assembly. They have full
# function-level annotations, but their deeply nested f-string / dict
# manipulation triggers hundreds of strict-mode false positives (e.g.
# subscripting metadata dicts, openpyxl cell() overload resolution,
# union-attr on Violation|dict dual-path code). A future refactor should
# replace the raw string building with Jinja2 templates, at which point
# these overrides can be removed.

[tool.pyright]
pythonVersion = "3.11"
include = [
    "auto_a11y",
    "tests",
    "stubs",
    "config.py",
    "run.py",
    "wsgi.py",
    "test_fixtures.py",
    # PDF audit engine port — Phase 7.
    "scripts/port_pdfmax_remediation_guide.py",
]
stubPath = "stubs"
typeCheckingMode = "strict"

reportMissingTypeStubs = "error"
reportImplicitOverride = "error"
reportUninitializedInstanceVariable = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedExpression = "error"
reportImplicitStringConcatenation = "error"
# reportShadowedImports: not present in pyright 1.1.408 — re-add on upgrade if added upstream

[tool.ty]
# ty 0.0.31 (pre-alpha); config surface consulted via `ty check --help`
# and `ty explain rule --output-format json`.
#
# ty's config sections: environment, src, rules, terminal, analysis, overrides.
# There is no single "strict mode" flag equivalent to mypy's `strict = true` or
# pyright's `typeCheckingMode = "strict"`. Strictness is achieved by escalating
# individual rules from their defaults (warn / ignore) to "error", and by
# enabling analysis options that correspond to permissive defaults.

# ── Environment ───────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.11"
extra-paths = ["stubs"]

# ── Source / file selection ───────────────────────────────────────────────────
[tool.ty.src]
# Exclude out-of-scope root-level scripts and directories.
# fixture_generation/ and scripts/ are enumerated (rather than blanket-excluded)
# so that fixture_generation/pdf/** and scripts/port_pdfmax_remediation_guide.py
# can opt INTO strict typecheck when they land (see PDF audit engine port plan,
# Phases 7 and 10).
exclude = [
    "archive/",
    "demo_site/",
    "electron/",
    # fixture_generation/ — enumerated subdirs (pdf/ will opt in when it lands)
    "fixture_generation/by_touchpoint/",
    # scripts/ — enumerated scripts (port_pdfmax_remediation_guide.py will opt in when it lands)
    "scripts/apply_what_generic.py",
    "scripts/apply_what_generic_v2.py",
    "scripts/apply_what_generic_v3.py",
    "scripts/apply_what_generic_v4.py",
    "scripts/audit_generic_descriptions.py",
    "scripts/audit_generic_descriptions_simple.py",
    "scripts/create_phase1_template.py",
    "scripts/extract_issue_descriptions.py",
    "scripts/generate_issue_catalog.py",
    "scripts/identify_phase1_issues.py",
    "scripts/migrate_impact_levels.py",
    "scripts/migrate_test_results.py",
    "scripts/migrate_test_results_to_items.py",
    "scripts/migrate_to_touchpoints.py",
    "scripts/rename_category_to_touchpoint.py",
    "scripts/translate_phase1_batch.py",
    "scripts/translate_phase1_direct.py",
    "scripts/translate_phase2.py",
    "scripts/translate_phase3.py",
    "scripts/translate_phase4.py",
    "scripts/translate_phase5.py",
    "scripts/translate_phase6.py",
    "scripts/translate_with_anthropic.py",
    "scripts/translate_with_anthropic_schema.py",
    "scripts/update_page_counts.py",
    "scripts/what_generic_additions.py",
    "add_*.py",
    "cleanup_*.py",
    "migrate_*.py",
    "translate_*.py",
    "debug_*.py",
    "diagnose_*.py",
    "investigate_*.py",
    "analyze_*.py",
    "create_phase*.py",
    "delete_*.py",
    "clear_*.py",
    "show_*.py",
    "examine_*.py",
    "revert_*.py",
    "merge_*.py",
    "generate_fixtures*.py",
    "download_chromium.py",
    "gunicorn.conf.py",
]

# ── Analysis options ──────────────────────────────────────────────────────────
[tool.ty.analysis]
# Honour `# type: ignore` and `# ty: ignore` suppression comments.
# Setting to false would ignore ALL suppressions — too aggressive; leave true.
respect-type-ignore-comments = true
# no ty equivalent: mypy `disallow_any_unimported` — no `Any`-import knob at 0.0.31
# no ty equivalent: mypy `implicit_reexport` — no re-export strictness knob at 0.0.31
# no ty equivalent: mypy `strict_equality` — no equality strictness knob at 0.0.31

# ── Terminal / output ─────────────────────────────────────────────────────────
[tool.ty.terminal]
# Treat warning-level diagnostics as errors, matching mypy's `--strict` posture.
error-on-warning = true

# ── Rules: escalate every non-error default to "error" ───────────────────────
# All rules whose default_level is "warn" or "ignore" at ty 0.0.31 are listed
# here. Escalating them to "error" is the closest available equivalent of
# mypy strict / pyright strict.
[tool.ty.rules]
# Default "warn" → escalate to "error"
ambiguous-protocol-member = "error"
deprecated = "error"
ignore-comment-unknown-rule = "error"
ineffective-final = "error"
invalid-enum-member-annotation = "error"
invalid-ignore-comment = "error"
invalid-legacy-positional-parameter = "error"
invalid-named-tuple-override = "error"
mismatched-type-name = "error"
possibly-missing-implicit-call = "error"
possibly-missing-submodule = "error"
redundant-cast = "error"
redundant-final-classvar = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsupported-base = "error"
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
useless-overload-body = "error"

# Default "ignore" → escalate to "error" where safe at pre-alpha
# division-by-zero: escalate — catches real bugs
division-by-zero = "error"
# possibly-missing-attribute: escalate — equivalent to pyright strict member checks
possibly-missing-attribute = "error"
# possibly-missing-import: escalate — equivalent to mypy `disallow_any_unimported` intent
possibly-missing-import = "error"
# possibly-unresolved-reference: escalate — catches undefined names
possibly-unresolved-reference = "error"
# unsupported-dynamic-base: escalate — dynamic bases obscure type errors
unsupported-dynamic-base = "error"
